name: Refresh Champions data

# Rebuilds src/data/champions-data.json from Showdown and PokeAPI once a week
# and opens a pull request only when the data changed. A failed download or a
# failed validation fails the run; nothing is merged without review.
on:
  schedule:
    - cron: "0 0 * * 1" # Monday 09:00 KST
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: refresh-champions-data
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    env:
      BRANCH: data/champions-refresh
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run data:champions

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- src/data/champions-data.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Champions data is already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # The identity audit checks every regulation Pokémon against the new data.
      - if: steps.diff.outputs.changed == 'true'
        run: npm test

      - if: steps.diff.outputs.changed == 'true'
        name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -m "chore(data): refresh Champions data from Showdown and PokeAPI" -- src/data/champions-data.json
          git push --force origin "$BRANCH"
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" = "0" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(data): refresh Champions data" \
              --body "The weekly refresh found new Showdown or PokeAPI data. npm run data:champions validated it and npm test passed. Merging deploys it."
          fi
