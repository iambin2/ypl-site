name: Supabase keep-alive

# Free-tier projects pause after 7 days without activity. One read twice a week keeps YPL awake.
# GitHub also disables schedules in a public repo after 60 days without commits, so each run re-enables itself.
on:
  schedule:
    - cron: "0 3 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          set -a; . ./.env.production; set +a
          curl --fail --silent --show-error \
            -H "apikey: $VITE_SUPABASE_ANON_KEY" -H "Authorization: Bearer $VITE_SUPABASE_ANON_KEY" \
            "$VITE_SUPABASE_URL/rest/v1/site_data?select=key&limit=1"
      - run: gh api -X PUT "repos/$GITHUB_REPOSITORY/actions/workflows/supabase-keepalive.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
