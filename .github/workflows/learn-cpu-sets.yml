name: Teach the computer

# Blends the sets players bring against the computer (public.cpu_battles) into what it believes a Pokémon carries
# (src/data/random-sets.json) with scripts/learn-cpu-sets.mjs, and opens a pull request only when that changed. Under 30 players
# (parties that look alike count as one) the script writes nothing. Nothing is merged without review; merging deploys the site, and the battle function needs
# npm run build:battle and its own deploy to pick the sets up for random parties.
#
# Run by hand for now. Once weeks of battles are in, turn on the weekly run by adding under on:
#   schedule:
#     - cron: "0 1 * * 1" # Monday 10:00 KST, an hour after the Champions data refresh
# Needs the repository secrets VITE_SUPABASE_URL (already there) and SUPABASE_SERVICE_ROLE_KEY.
on:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: learn-cpu-sets
  cancel-in-progress: false

jobs:
  learn:
    runs-on: ubuntu-latest
    env:
      BRANCH: data/cpu-learn
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run data:cpu-learn
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Check for changes
        id: diff
        run: |
          if git diff --quiet -- src/data/random-sets.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - if: steps.diff.outputs.changed == 'true'
        run: npm test

      - if: steps.diff.outputs.changed == 'true'
        name: Open or update the pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -m "chore(data): teach the computer from YPL battles" -- src/data/random-sets.json
          git push --force origin "$BRANCH"
          if [ "$(gh pr list --head "$BRANCH" --state open --json number --jq length)" = "0" ]; then
            gh pr create --base main --head "$BRANCH" \
              --title "chore(data): teach the computer from YPL battles" \
              --body "scripts/learn-cpu-sets.mjs blended the parties players brought against the computer into its set beliefs, and npm test passed. Merging deploys the site; run npm run build:battle and deploy the battle function for random parties to use the sets too."
          fi
