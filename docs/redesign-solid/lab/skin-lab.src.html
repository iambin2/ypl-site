<title>YPL 스킨 랩</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* one body of rules, three materials. Everything that moves moves by transform and opacity on its own small layer;
   nothing that moves carries a blur, a filter, a moving mask or a live shadow. Depth comes from tone. */
@font-face { font-family: "SUIT Variable"; src: url("data:font/woff2;base64,/*FONT*/") format("woff2"); font-weight: 100 900; font-display: swap; }
:root {
  color-scheme: dark;
  --s1: 4px; --s2: 8px; --s3: 12px; --s4: 16px; --s5: 20px; --s6: 24px; --s10: 40px; --s14: 56px;
  --gutter: max(16px, env(safe-area-inset-left, 0px));
  --spring-snappy: linear(0, .0213, .0765, .1538, .244, .34, .4363, .5288, .6149, .6928, .7617, .8212, .8716, .9132, .9469, .9734, .9937, 1.0087, 1.0191, 1.0259, 1.0298, 1.0314, 1.0313, 1.0299, 1.0278, 1.025, 1.0221, 1.019, 1.016, 1.0132, 1.0107, 1.0084, 1.0064, 1.0047, 1.0032, 1.0021, 1);
  --ease-out: cubic-bezier(.22, 1, .36, 1);
  /* A solid: tone steps on true black, selection is the inverse fill */
  --stage: #000; --sf: #141414; --sf-2: #1F1F1F; --sf-3: #2C2C2C; --fg: #F5F5F5; --fg-2: #B0B0B0; --fg-3: #8C8C8C; --inv: #F5F5F5; --on-inv: #000;
  --bar: #1C1C1C; --lens: var(--inv); --on-lens: var(--on-inv); --sheet: #161616; --sheet-fg: var(--fg); --sheet-2: var(--fg-3); --sheet-row: #222;
  --line: #3A3A3A; --line-lit: #F5F5F5; --scrim: .62; --title: clamp(1.75rem, 1.5rem + 1vw, 2.25rem); --r-card: 24px; --r-row: 16px; --card-pad: 8px;
  --row-t: 1rem; --row-w: 600; --sheen: none; --lift: none; --beam: transparent; --mark: var(--fg);
}
:root[data-tone="light"] { color-scheme: light; --stage: #EFEFEF; --sf: #FFF; --sf-2: #F3F3F3; --sf-3: #E4E4E4; --fg: #0A0A0A; --fg-2: #525252; --fg-3: #6B6B6B; --inv: #0A0A0A; --on-inv: #FFF;
  --bar: #FFF; --sheet: #FFF; --sheet-row: #F2F2F2; --line: #BDBDBD; --line-lit: #0A0A0A; --scrim: .28; }
/* B poster: no boxes at all, the words are the picture; a sheet is the page turned inside out */
:root[data-skin="b"] { --stage: #000; --bar: transparent; --lens: var(--fg); --sheet: #F5F5F5; --sheet-fg: #0A0A0A; --sheet-2: #6B6B6B; --sheet-row: #E4E4E4;
  --sf: transparent; --sf-2: #1A1A1A; --title: clamp(3rem, 2rem + 6vw, 5.5rem); --card-pad: 0px; --r-row: 0px; --row-t: 1.25rem; --row-w: 700; --line: #2E2E2E; }
:root[data-skin="b"][data-tone="light"] { --stage: #FFF; --sf-2: #F0F0F0; --sheet: #0A0A0A; --sheet-fg: #F5F5F5; --sheet-2: #8C8C8C; --sheet-row: #262626; --line: #D0D0D0; }
/* C matte: the current site's ceiling light kept, painted once; a soft sheen baked into the surfaces, no glass */
:root[data-skin="c"] { --stage: #0B0B0B; --sf: #171717; --sf-2: #222; --sf-3: #2E2E2E; --bar: #222; --lens: #3C3C3C; --on-lens: #FFF; --sheet: #1B1B1B; --sheet-row: #2A2A2A; --line: #3C3C3C; --r-card: 32px; --r-row: 24px;
  --sheen: linear-gradient(180deg, rgb(255 255 255 / .07), transparent 64px); --lift: 0 18px 32px -22px #000; --beam: rgb(255 255 255 / .13); }
:root[data-skin="c"][data-tone="light"] { --stage: #E4E4E4; --sf: #FFF; --sf-2: #F4F4F4; --sf-3: #E6E6E6; --bar: #F7F7F7; --lens: #FFF; --on-lens: #0A0A0A; --sheet: #FAFAFA; --sheet-row: #EFEFEF; --line: #B8B8B8;
  --sheen: linear-gradient(180deg, #FFF, transparent 64px); --lift: 0 18px 32px -24px rgb(0 0 0 / .32); --beam: rgb(255 255 255 / .8); }

*, *::before, *::after { box-sizing: border-box; }
html { background: var(--stage); scrollbar-gutter: stable; -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--stage); color: var(--fg); font: 400 1rem/1.55 "SUIT Variable", -apple-system, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif; word-break: keep-all; -webkit-font-smoothing: antialiased; overflow-x: clip; }
h1, h2, h3, p, ul, ol { margin: 0; padding: 0; list-style: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
:focus { outline: none; } :focus-visible { outline: 2px solid var(--fg); outline-offset: 3px; }
.ic { display: block; flex: none; fill: currentColor; }
.press { transition: scale 400ms var(--spring-snappy); }
.press:active { scale: .97; transition: scale 90ms var(--ease-out); }

/* the bars never blur what is under them: the page dissolves into the stage at the two edges, on two still gradients */
.edge { position: fixed; z-index: 15; left: 0; right: 0; pointer-events: none; }
.edge.t { top: 0; height: calc(env(safe-area-inset-top, 0px) + 88px); background: linear-gradient(var(--stage) 44%, transparent); }
.edge.b { bottom: 0; height: calc(env(safe-area-inset-bottom, 0px) + 120px); background: linear-gradient(transparent, var(--stage) 62%); }
.top { position: fixed; z-index: 20; top: calc(env(safe-area-inset-top, 0px) + var(--s3)); left: 0; right: 0; margin-inline: auto; width: min(100% - var(--gutter) * 2, 1200px); height: 56px; padding: 0 6px; display: flex; align-items: center; gap: var(--s2); border-radius: 999px; background: var(--bar); background-image: var(--sheen); box-shadow: var(--lift); will-change: transform; }
:root:not([data-skin="c"]) .top { background: none; padding: 0; }
.brand { display: flex; align-items: center; gap: var(--s2); height: 44px; padding: 0 var(--s2); border-radius: 999px; flex: none; }
.brand .mark { width: 36px; height: 24px; translate: 0 1px; }
.brand .word { height: 14px; width: auto; }
.nav { display: none; position: relative; margin-inline: auto; padding: var(--s1); }
.nav button { position: relative; z-index: 2; height: 36px; padding: 0 var(--s5); border-radius: 999px; font-size: .9375rem; font-weight: 600; line-height: 1; color: var(--fg-2); transition: color 120ms; }
.skins { margin-left: auto; display: flex; gap: var(--s1); }
.skins button { width: 32px; height: 32px; border-radius: 50%; font-size: .8125rem; font-weight: 600; color: var(--fg-2); }
.skins button[aria-pressed="true"] { background: var(--inv); color: var(--on-inv); }
.icon { width: 44px; height: 44px; display: grid; place-items: center; border-radius: 50%; flex: none; }
.tabs { position: fixed; z-index: 20; left: 0; right: 0; bottom: calc(env(safe-area-inset-bottom, 0px) + var(--s3)); margin-inline: auto; width: min(100% - var(--gutter) * 2, 440px); height: 64px; padding: var(--s1); display: grid; grid-template-columns: repeat(5, 1fr); border-radius: 999px; background: var(--bar); background-image: var(--sheen); box-shadow: var(--lift); will-change: transform; }
.tabs button { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: var(--s1); border-radius: 999px; color: var(--fg-2); font-size: .75rem; font-weight: 600; line-height: 1; transition: color 120ms; }
.tabs .ics { display: grid; } .tabs .ics > * { grid-area: 1 / 1; } .tabs .on { opacity: 0; }
.tabs [aria-current] .on { opacity: 1; } .tabs [aria-current] .off { opacity: 0; }
:is(.tabs, .nav) [aria-current] { color: var(--on-lens); }
.lens { position: absolute; z-index: 1; top: var(--s1); bottom: var(--s1); left: 0; width: 0; pointer-events: none; }
.lens > i { position: absolute; top: 0; left: 0; height: 100%; background: var(--lens); will-change: transform; }
.lens > i:not(:nth-child(2)) { aspect-ratio: 1; border-radius: 50%; }
.lens > i:nth-child(2) { width: 100px; transform-origin: 0 50%; }
/* the poster's tabs have no pill: the words stand on the stage and the chosen one is the bright one over a small dot */
:root[data-skin="b"] .tabs { box-shadow: none; }
:root[data-skin="b"] :is(.tabs, .nav) [aria-current] { color: var(--fg); }
:root[data-skin="b"] .tabs .ics { display: none; }
:root[data-skin="b"] .tabs button { font-size: .9375rem; }
:root[data-skin="b"] .lens { top: auto; bottom: 8px; height: 6px; }
:root[data-skin="b"] .nav .lens { bottom: 0; }

.page { position: relative; z-index: 1; width: min(100% - var(--gutter) * 2, 1200px); margin-inline: auto; padding-block: calc(env(safe-area-inset-top, 0px) + 92px) calc(env(safe-area-inset-bottom, 0px) + 116px); min-height: 100svh; }
.pg { display: flex; flex-direction: column; gap: var(--s10); }
.pg[hidden] { display: none; }
.head { display: flex; flex-direction: column; gap: var(--s2); }
h1.t { font-size: var(--title); line-height: 1.1; font-weight: 800; letter-spacing: -.03em; }
:root[data-skin="b"] h1.t { letter-spacing: -.04em; line-height: 1; }
h2.h { font-size: 1.25rem; line-height: 1.35; font-weight: 700; letter-spacing: -.015em; }
.sub { font-size: .9375rem; color: var(--fg-2); }
.sec { display: flex; flex-direction: column; gap: var(--s4); }
.card { background: var(--sf); background-image: var(--sheen); box-shadow: var(--lift); border-radius: var(--r-card); }
.list { padding: var(--card-pad); display: flex; flex-direction: column; }
.row { width: 100%; min-height: 60px; padding: var(--s3); display: flex; align-items: center; gap: var(--s3); text-align: left; border-radius: var(--r-row); }
:root[data-skin="b"] .row { min-height: 76px; padding: var(--s3) 0; }
@media (hover: hover) { .row:hover { background: var(--sf-2); } :root[data-skin="b"] .row:hover { background: none; color: var(--fg-2); } }
.row .tx { min-width: 0; flex: 1; display: flex; flex-direction: column; gap: var(--s1); }
.row b { font-size: var(--row-t); font-weight: var(--row-w); line-height: 1.35; }
.row small { font-size: .8125rem; line-height: 1.45; color: var(--fg-3); }
.row .tail { font-size: .9375rem; font-weight: 600; color: var(--fg-2); font-variant-numeric: tabular-nums; flex: none; }
.row .rk { width: 28px; text-align: center; font-weight: 800; font-size: 1.0625rem; font-variant-numeric: tabular-nums; flex: none; }
.pin { display: inline-flex; align-items: center; height: 20px; padding: 0 var(--s2); margin-right: var(--s2); border-radius: 999px; background: var(--inv); color: var(--on-inv); font-size: .75rem; font-weight: 600; vertical-align: 2px; }
.lead { padding: var(--s6); display: flex; flex-direction: column; gap: var(--s5); }
:root:not([data-skin="c"]):not([data-skin="b"]) .lead { background: var(--inv); color: var(--on-inv); }
:root:not([data-skin="c"]):not([data-skin="b"]) .lead :is(.sub, small) { color: inherit; opacity: .68; }
:root[data-skin="b"] .lead { padding: 0; }
.lead-fig { display: flex; align-items: baseline; gap: var(--s1); }
.fig { font-size: 4.5rem; line-height: 1; font-weight: 800; letter-spacing: -.04em; font-variant-numeric: tabular-nums; }
:root[data-skin="b"] .fig { font-size: clamp(6rem, 22vw, 11rem); letter-spacing: -.05em; }
.unit { font-size: .9375rem; font-weight: 600; }
.btn { height: 48px; padding: 0 var(--s6); border-radius: 999px; font-size: 1rem; font-weight: 600; line-height: 1; display: inline-flex; align-items: center; justify-content: center; background: var(--inv); color: var(--on-inv); }
.btn.alt { background: var(--sf-2); color: var(--fg); }
:root:not([data-skin="c"]):not([data-skin="b"]) .lead .btn { background: var(--on-inv); color: var(--inv); }
.btns { display: flex; flex-wrap: wrap; gap: var(--s2); }

/* home: the field never repaints. Lines are drawn once; the pointer's light is a small texture stretched over the screen,
   a dark sheet with a soft hole in it that slides over the lit lines by transform alone. */
.ha { position: relative; min-height: calc(100svh - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px) - 208px); display: flex; flex-direction: column; justify-content: flex-end; align-items: center; text-align: center; gap: var(--s5); }
.stage { position: fixed; inset: 0; z-index: 0; overflow: clip; pointer-events: none; contain: strict; }
.stage[hidden] { display: none; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.stage svg.f { position: absolute; inset: 0; width: 100%; height: 100%; }
.f path { fill: var(--line); fill-rule: evenodd; }
.f.lit path { fill: var(--line-lit); }
.cover { position: absolute; left: 0; top: 0; will-change: transform; }
.beam { position: absolute; inset: 0 0 auto; height: 72%; background: radial-gradient(52% 100% at 50% 0, var(--beam), transparent); }
.stage .fade { position: absolute; inset: 0; background: linear-gradient(var(--stage) 16%, transparent 34%, transparent 62%, var(--stage) 92%); }
.ypl { position: absolute; left: 50%; bottom: 44%; height: clamp(88px, 15vw, 216px); translate: -50% 0; }
.ypl svg { display: block; height: 100%; width: auto; overflow: visible; color: var(--mark); }
.ypl .band { position: absolute; inset: 0; overflow: hidden; }
.ypl .band i { position: absolute; inset: 0 -60%; background: linear-gradient(100deg, transparent 40%, rgb(128 128 128 / .9) 50%, transparent 60%); will-change: transform; transform: translateX(-100%); }
.refl { position: absolute; left: 50%; top: 56%; height: clamp(88px, 15vw, 216px); translate: -50% 0; scale: 1 -1; opacity: .18; color: var(--mark); -webkit-mask: linear-gradient(to top, #000, transparent 60%); mask: linear-gradient(to top, #000, transparent 60%); }
.refl svg { display: block; height: 100%; width: auto; }
.wave { position: absolute; left: 50%; top: 56%; width: 180px; height: 62px; margin: -31px 0 0 -90px; border-radius: 50%; background: radial-gradient(closest-side, transparent 80%, var(--line-lit) 94%, transparent); opacity: 0; will-change: transform, opacity; }
.ev { display: flex; flex-direction: column; align-items: center; gap: var(--s1); }
.ev .fig { font-size: 1.75rem; letter-spacing: -.02em; }
.ev-row { display: flex; align-items: baseline; flex-wrap: wrap; justify-content: center; column-gap: var(--s3); }
.ev-name { font-size: 1.0625rem; font-weight: 800; }
.ev-meta { font-size: .8125rem; color: var(--fg-2); }
:root[data-skin="b"] .stage .f { opacity: .55; }
:root[data-skin="b"] .ev .fig { font-size: clamp(3.5rem, 15vw, 5rem); }
:root[data-skin="b"] .stage { translate: 0 -8svh; }
.ha .btns { justify-content: center; }

/* bracket: lines are one still drawing, the champion's road is the bright one */
.bk { display: grid; grid-template-columns: repeat(4, 200px); gap: var(--s4) var(--s6); overflow-x: auto; padding-bottom: var(--s2); scrollbar-width: none; margin-inline: calc(var(--gutter) * -1); padding-inline: var(--gutter); }
.bk h3 { font-size: .8125rem; font-weight: 600; color: var(--fg-3); }
.bk-c { display: flex; flex-direction: column; justify-content: space-around; gap: var(--s3); min-height: 440px; }
.bk-p { flex: 1; position: relative; display: flex; flex-direction: column; justify-content: space-around; gap: var(--s3); }
.bk-p:has(> :nth-child(2))::after { content: ""; position: absolute; left: calc(100% + 11px); top: 25%; bottom: 25%; width: 2px; background: var(--line); }
.bk-p:has(> .road)::after { background: linear-gradient(var(--a, var(--line)) 50%, var(--b, var(--line)) 50%); }
.bk-p:has(> .road:first-child) { --a: var(--fg); } .bk-p:has(> .road:last-child) { --b: var(--fg); }
.bk-m { position: relative; }
.bk-m::before, .bk-m::after { content: ""; position: absolute; top: 50%; height: 2px; margin-top: -1px; width: 12px; background: var(--line); }
.bk-m::after { left: 100%; } .bk-m::before { right: 100%; }
.bk-m.road::after, .bk-m.lit::before, .bk-champ::before { background: var(--fg); }
.bk-c:first-of-type .bk-m.q::before { display: none; }
.bk-m { background: var(--sf-2); background-image: var(--sheen); border-radius: var(--s3); padding: var(--s1); font-size: .9375rem; }
:root[data-skin="b"] .bk-m { background: none; padding: 0; }
.bk-m div { display: flex; align-items: center; gap: var(--s2); height: 40px; padding: 0 var(--s2); border-radius: var(--s2); color: var(--fg-2); }
.bk-m i { font-style: normal; width: 16px; text-align: center; font-size: .75rem; color: var(--fg-3); font-variant-numeric: tabular-nums; }
.bk-m .w { color: var(--fg); font-weight: 600; }
.bk-champ { position: relative; background: var(--inv); color: var(--on-inv); border-radius: var(--s3); padding: var(--s4); font-weight: 800; }
.bk-champ::before { content: ""; position: absolute; right: 100%; top: 50%; width: 12px; height: 2px; margin-top: -1px; }
.bk-champ small { display: block; font-size: .8125rem; font-weight: 600; opacity: .68; }

/* a sheet is opaque and moves by one transform; the page behind steps back by one */
.ov { position: fixed; inset: 0; z-index: 40; }
.ov[hidden] { display: none; }
.scrim { position: absolute; inset: 0; background: #000; opacity: var(--scrim); }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; max-height: 88svh; overflow: auto; padding: var(--s6) max(var(--s6), var(--gutter)) calc(env(safe-area-inset-bottom, 0px) + var(--s6)); border-radius: 32px 32px 0 0; background: var(--sheet); background-image: var(--sheen); color: var(--sheet-fg); will-change: transform; overscroll-behavior: contain; touch-action: pan-y; display: flex; flex-direction: column; gap: var(--s6); --fg-2: var(--sheet-2); --fg-3: var(--sheet-2); --sf: var(--sheet-row); --sf-2: var(--sheet-row); }
.grip { position: absolute; top: var(--s2); left: 50%; width: 36px; height: 4px; margin-left: -18px; border-radius: 2px; background: var(--sheet-2); opacity: .4; }
.sheet:focus-visible { outline: none; }
.sheet h2 { font-size: 1.75rem; line-height: 1.15; font-weight: 800; letter-spacing: -.02em; }
.sheet-x { position: absolute; top: var(--s3); right: var(--s3); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; background: var(--sheet-row); }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: var(--s3); }
.stats b { display: block; font-size: 1.75rem; line-height: 1.1; font-weight: 800; font-variant-numeric: tabular-nums; }
.stats span { font-size: .8125rem; color: var(--sheet-2); }
.veil { position: fixed; inset: 0; z-index: 60; pointer-events: none; }
.toast { position: fixed; z-index: 50; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 84px); translate: -50% 0; padding: var(--s2) var(--s4); border-radius: 999px; background: var(--inv); color: var(--on-inv); font-size: .8125rem; font-weight: 600; white-space: nowrap; opacity: 0; pointer-events: none; }

@media (min-width: 860px) {
  .tabs { display: none; } .edge.b { display: none; }
  .nav { display: flex; }
  .top { top: var(--s4); }
  .page { padding-block: 112px 96px; }
  .sheet { left: 50%; right: auto; bottom: 50%; width: 520px; margin: 0 0 0 -260px; border-radius: 32px; translate: 0 50%; max-height: 80svh; }
  .grip { display: none; }
  .bk { grid-template-columns: repeat(4, 1fr); }
}
@media (prefers-reduced-motion: reduce) { .press { transition: none; } .press:active { scale: 1; opacity: .75; } }
</style>

<div class="edge t"></div><div class="edge b"></div>
<header class="top">
  <button class="brand press" data-go="home" aria-label="YPL 홈으로"><svg class="mark ic" viewBox="0 0 1315.1 870.6" aria-hidden="true"><path fill-rule="evenodd" d="/*MARK*/"/></svg><svg class="word ic" viewBox="0 0 310 100" aria-hidden="true"><path transform="skewX(-12) translate(21 0)" fill-rule="evenodd" d="/*WORD*/"/></svg></button>

</header>

  </div></section>

  const svg = `<svg xmlns='http://www.w3.org/2000/svg' viewBox='-4 -4 318 108'><path transform='skewX(-12) translate(21 0)' fill-rule='evenodd' d='${$(".word path").getAttribute("d")}'/></svg>`, u = `url("data:image/svg+xml,${encodeURIComponent(svg)}")`, b = $("#band");
  b.style.webkitMask = b.style.mask = `${u} center / contain no-repeat`;
  if (!reduced()) $("#band i").animate([{ transform: "translateX(-100%)" }, { transform: "translateX(100%)" }], { duration: 1100, delay: 200, easing: "cubic-bezier(.65,0,.35,1)" });
}

/* ---------- skin and theme: the page changes under one still veil of the old stage, which fades ---------- */
function veil(run) {
  if (reduced()) return run();
  const v = document.createElement("div"); v.className = "veil"; v.style.background = getComputedStyle(root).getPropertyValue("--stage"); document.body.append(v); run();
  v.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 240, easing: "ease-out" }).finished.then(() => v.remove());
}
const NAMES = { a: "A 솔리드", b: "B 포스터", c: "C 매트" };
function setSkin(s, say) {
  const run = () => { root.dataset.skin = s; $$(".skins button").forEach(b => b.setAttribute("aria-pressed", b.dataset.skin === s)); if (fine) drawCover(); pills(false); };
  say ? veil(run) : run();
  if (say) { const t = $("#toast"); t.textContent = NAMES[s]; t.getAnimations().forEach(a => a.cancel()); t.animate([{ opacity: 0, transform: "translateY(-4px)" }, { opacity: 1, transform: "none", offset: .15 }, { opacity: 1, offset: .8 }, { opacity: 0 }], { duration: 1400, easing: "ease-out" }); try { location.hash = s; } catch {} }
}
$("#tone").onclick = () => veil(() => { root.dataset.tone = root.dataset.tone === "light" ? "dark" : "light"; if (fine) drawCover(); });

/* ---------- start ---------- */
$$("[data-tab='home']").forEach(b => b.setAttribute("aria-current", "page"));
setSkin(["a", "b", "c"].includes(location.hash.slice(1)) ? location.hash.slice(1) : "a");
drawField(); if (fine) place(); bandMask(); pills(false);
document.fonts?.ready.then(() => pills(false));
addEventListener("resize", () => { drawField(); pills(false); });
window.__go = go; window.__open = openSheet; window.__close = closeSheet;
</script>
