   16 blocks inside a card, section title to content / 20 card padding / 24 page title to content / 40 (56 desktop) between sections.
   Radius law: inner radius = outer radius - padding. Cards 32 with 20 padding hold 12px tiles; controls are pills. */

  --tint:rgb(255 255 255 / .09);--tint-strong:rgb(255 255 255 / .18);
  --glass:rgb(30 30 30 / .36);--glass-l3:rgb(24 24 24 / .66);--glass-lite:rgb(255 255 255 / .06);--glass-solid:#202020;--glass-bright:1.14;
  --sheen:rgb(255 255 255 / .1);--edge:inset 0 1px 0 rgb(255 255 255 / .2),inset 0 -1px 0 rgb(255 255 255 / .08),inset 0 0 14px rgb(255 255 255 / .04);
  --rim-top:rgb(255 255 255 / .42);--rim-mid:rgb(255 255 255 / .06);--rim-bottom:rgb(255 255 255 / .16);
  --rimc-top:rgb(255 255 255 / .08);--rimc-bottom:rgb(255 255 255 / .02);
  --shadow-near:0 1px 1px rgb(0 0 0 / .4);--shadow-far:0 18px 40px -14px rgb(0 0 0 / .7);
  --l3-shadow:0 1px 1px rgb(0 0 0 / .45),0 30px 70px -24px rgb(0 0 0 / .8);
  --card-shadow:0 1px 1px rgb(0 0 0 / .35),0 24px 48px -28px rgb(0 0 0 / .85);
  --ind-fill:rgb(255 255 255 / .16);--ind-fg:#FFFFFF;--ind-shadow:inset 0 1px 0 rgb(255 255 255 / .14),0 1px 2px rgb(0 0 0 / .3);
  --hl:rgb(255 255 255 / .09);

  --la-live:rgb(255 255 255 / .23);--lb-live:rgb(255 255 255 / .1);
  --la-done:rgb(255 255 255 / .08);--lb-done:rgb(255 255 255 / .03);
  --shimmer:rgb(255 255 255 / .07);

/* base */
*,*::before,*::after{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;scrollbar-color:var(--fg-3) transparent}
body{margin:0;background:var(--stage);color:var(--fg);font:400 1rem/1.6 var(--font);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;word-break:keep-all;overflow-wrap:break-word;overflow-x:clip}
::selection{background:var(--sel-bg)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:center;-webkit-tap-highlight-color:transparent}
input{font:inherit;color:inherit}
h1,h2,h3,p,ul,ol{margin:0}
ul,ol{padding:0;list-style:none}
:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
.num{font-variant-numeric:tabular-nums}
.ic{width:20px;height:20px;fill:currentColor;flex:none}

/* type: display 40-64, title 28-36, headline 20, body 16, callout 15, caption 13, eyebrow 12 */
.eyebrow{font-size:.75rem;line-height:1.3;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3)}
.display{font-size:clamp(2.5rem,2rem + 2.4vw,4rem);line-height:1.06;font-weight:780;letter-spacing:-.04em;text-wrap:balance}
.title{font-size:clamp(1.75rem,1.5rem + 1vw,2.25rem);line-height:1.15;font-weight:740;letter-spacing:-.03em;text-wrap:balance}
.headline{font-size:1.25rem;line-height:1.35;font-weight:720;letter-spacing:-.015em}
.callout{font-size:.9375rem;line-height:1.55;color:var(--fg-2)}
.caption{font-size:.8125rem;line-height:1.45;color:var(--fg-3)}

/* L0 stage: graphite with one soft light from directly above (C3) */
.stage{position:fixed;inset:0;z-index:-1;overflow:hidden;background:var(--stage);--la:var(--la-open);--lb:var(--lb-open);transition:--la 1.4s var(--ease-in-out),--lb 1.4s var(--ease-in-out)}
.stage[data-state="live"]{--la:var(--la-live);--lb:var(--lb-live)}
.stage[data-state="done"]{--la:var(--la-done);--lb:var(--lb-done)}
.light{position:absolute;border-radius:50%;pointer-events:none;will-change:transform}
.light-a{width:140vw;height:100vh;left:-20vw;top:-50vh;background:radial-gradient(closest-side,var(--la),transparent);translate:var(--lx,0px) var(--ly,0px);transition:translate 1.8s var(--ease-in-out);animation:drift-a 52s var(--ease-in-out) infinite alternate}
.light-b{width:110vw;height:70vh;left:-45vw;bottom:-35vh;background:radial-gradient(closest-side,var(--lb),transparent);translate:calc(var(--lx,0px) * -.6) 0;transition:translate 1.8s var(--ease-in-out);animation:drift-b 68s var(--ease-in-out) infinite alternate}
@keyframes drift-a{from{transform:translate3d(-4vw,0,0)}to{transform:translate3d(4vw,3vh,0)}}
@keyframes drift-b{from{transform:translate3d(0,0,0)}to{transform:translate3d(30vw,-6vh,0)}}
.stage::after{content:"";position:absolute;inset:0;background:var(--grain) 0 0/128px 128px}

/* glass: L2 bars and floating controls, L3 sheets and popovers, lite = the same look on a flat surface without blur (C7).
   What makes it read as glass rather than a tinted panel: a clear body that brightens what is behind it, a sheen falling from the light above,
   and edges that catch light at the top and, through the glass, again at the bottom. No grain on glass: it stays clean. */
.glass,.glass-l3,.glass-lite,.card{position:relative}
.glass{background:linear-gradient(180deg,var(--sheen),transparent 60%),linear-gradient(var(--glass),var(--glass));-webkit-backdrop-filter:blur(20px) saturate(180%) brightness(var(--glass-bright));backdrop-filter:blur(20px) saturate(180%) brightness(var(--glass-bright));box-shadow:var(--edge),var(--shadow-near),var(--shadow-far)}
.glass-l3{background:linear-gradient(180deg,var(--sheen),transparent 50%),linear-gradient(var(--glass-l3),var(--glass-l3));-webkit-backdrop-filter:blur(32px) saturate(180%) brightness(var(--glass-bright));backdrop-filter:blur(32px) saturate(180%) brightness(var(--glass-bright));box-shadow:var(--edge),var(--l3-shadow)}
.glass-lite{background:linear-gradient(180deg,var(--sheen),transparent 60%),linear-gradient(var(--glass-lite),var(--glass-lite));box-shadow:var(--edge)}
.glass::before,.glass-l3::before,.glass-lite::before,.card::before{content:"";position:absolute;inset:0;z-index:2;border-radius:inherit;padding:1px;background:linear-gradient(180deg,var(--rim-top),var(--rim-mid) 42%,var(--rim-bottom));-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;pointer-events:none}
.card::before{background:linear-gradient(180deg,var(--rimc-top),var(--rimc-bottom))}
.card{background:var(--surface);box-shadow:var(--card-shadow)}
:root.cards-glass .card{background:linear-gradient(180deg,var(--sheen),transparent 60%),linear-gradient(var(--glass),var(--glass));-webkit-backdrop-filter:blur(20px) saturate(180%) brightness(var(--glass-bright));backdrop-filter:blur(20px) saturate(180%) brightness(var(--glass-bright));box-shadow:var(--edge),var(--card-shadow)}
:root.cards-glass .card::before{background:linear-gradient(180deg,var(--rim-top),var(--rim-mid) 42%,var(--rim-bottom))}
@supports not ((-webkit-backdrop-filter:blur(1px)) or (backdrop-filter:blur(1px))){.glass,.glass-l3{background:var(--glass-solid)}}

/* K1 press, K2 pointer highlight */
.press{transition:scale 400ms var(--spring-snappy),background-color var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out),opacity var(--dur-fast) var(--ease-out)}
.press:active{scale:.97;transition:scale 90ms var(--ease-out),background-color var(--dur-fast) var(--ease-out),color var(--dur-fast) var(--ease-out),opacity var(--dur-fast) var(--ease-out)}

@media (hover:hover) and (pointer:fine){
  .hl::after{content:"";position:absolute;inset:0;z-index:1;border-radius:inherit;background:radial-gradient(240px circle at var(--mx,50%) var(--my,50%),var(--hl),transparent 70%);opacity:0;transition:opacity var(--dur-base) var(--ease-out);pointer-events:none}
  .hl:hover::after{opacity:1}
}

/* bars: same width as the content so their edges line up with the gutter */
.topbar{position:fixed;z-index:20;top:calc(env(safe-area-inset-top,0px) + var(--s3));left:0;right:0;margin-inline:auto;width:min(100% - var(--gutter) * 2,1200px);height:56px;padding:0 6px;border-radius:999px;display:flex;align-items:center;gap:var(--s2);box-shadow:var(--edge);transition:translate 460ms var(--spring-snappy),box-shadow var(--dur-base) var(--ease-out)}
.topbar.scrolled{box-shadow:var(--edge),var(--shadow-near),var(--shadow-far)}
.topbar.hide{translate:0 calc(-100% - var(--s6) - env(safe-area-inset-top,0px));transition:translate 240ms var(--ease-in),box-shadow var(--dur-base) var(--ease-out)}
.brand{position:relative;display:flex;align-items:center;gap:var(--s2);height:44px;padding:0 var(--s3) 0 var(--s2);border-radius:999px}
#navLogo{display:flex}
.brand .logo{display:block;width:36px;height:28px;translate:0 1px}
/* YPL wordmark B (E6): drawn italic letters with one band cut through all three at the height of the Wing Y tail band */
.wordmark{display:block;height:14px;width:auto;fill:currentColor}
.navlinks{display:none}
.iconbtn{position:relative;display:grid;place-items:center;width:44px;height:44px;border-radius:50%;margin-left:auto}
.iconbtn .ic{width:22px;height:22px}
.theme-ic{display:grid}.theme-ic>*{grid-area:1/1;transition:opacity var(--dur-base) var(--ease-out),transform 520ms var(--spring-snappy)}
.theme-ic .i-sun{opacity:var(--sun-o);transform:rotate(calc((1 - var(--sun-o)) * -90deg)) scale(calc(.5 + var(--sun-o) * .5))}
.theme-ic .i-moon{opacity:calc(1 - var(--sun-o));transform:rotate(calc(var(--sun-o) * 90deg)) scale(calc(1 - var(--sun-o) * .5))}

.tabbar{position:fixed;z-index:20;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + var(--s3));margin-inline:auto;width:min(100% - var(--gutter) * 2,440px);height:64px;padding:var(--s1);border-radius:999px;display:grid;grid-template-columns:repeat(5,1fr);transition:translate 460ms var(--spring-snappy)}
.tabbar.hide{translate:0 calc(100% + var(--s6) + env(safe-area-inset-bottom,0px));transition:translate 240ms var(--ease-in)}
.tab{position:relative;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:var(--s1);border-radius:999px;color:var(--fg-2);font-size:.6875rem;line-height:1;font-weight:650}
.tab .ics{display:grid}.tab .ics>*{grid-area:1/1;width:24px;height:24px;transition:opacity var(--dur-fast) var(--ease-out)}
.tab .ic-on{opacity:0}
.tab[aria-current="page"]{color:var(--ind-fg)}
.tab[aria-current="page"] .ic-on{opacity:1}.tab[aria-current="page"] .ic-off{opacity:0}
.tab[aria-current="page"] .ics{animation:tab-pop 520ms var(--spring-snappy)}
@keyframes tab-pop{from{transform:scale(.86)}}
.pill-ind{position:absolute;z-index:1;top:var(--s1);bottom:var(--s1);left:var(--l,4px);right:var(--r,4px);border-radius:999px;background:linear-gradient(180deg,var(--sheen),transparent 70%),linear-gradient(var(--ind-fill),var(--ind-fill));box-shadow:var(--ind-shadow);transition:left 480ms var(--spring-snappy) var(--dl,0ms),right 480ms var(--spring-snappy) var(--dr,0ms),opacity var(--dur-fast)}

@media (min-width:860px){
  .tabbar{display:none}
  .topbar{top:var(--s4)}
  .navlinks{position:relative;display:flex;margin-inline:auto;padding:var(--s1);border-radius:999px}
  .navlink{position:relative;z-index:3;display:inline-flex;align-items:center;justify-content:center;height:36px;padding:0 var(--s5);border-radius:999px;font-size:.9375rem;line-height:1;font-weight:650;color:var(--fg-2)}
  .navlink[aria-current="page"]{color:var(--ind-fg)}
  .navlink[aria-expanded="true"]{color:var(--fg)}
  .iconbtn{margin-left:0}
}

/* page frame */
.main{width:min(100% - var(--gutter) * 2,1200px);margin-inline:auto;padding-block:calc(env(safe-area-inset-top,0px) + 92px) calc(env(safe-area-inset-bottom,0px) + 116px);display:flex;flex-direction:column;gap:var(--section)}
@media (min-width:860px){.main{padding-block:112px 96px}}
.ghost{position:fixed;z-index:5;pointer-events:none;margin:0}
.fly{position:fixed;z-index:6;margin:0!important;pointer-events:none;transform-origin:0 0}
.fly-skin{background:none!important;box-shadow:none!important;-webkit-backdrop-filter:none!important;backdrop-filter:none!important}
.fly-skin::before{display:none}
.page-top{display:flex;flex-direction:column;gap:var(--s6)}
.page-h{display:flex;flex-direction:column;gap:var(--s2)}
.page-h-row{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s4)}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:var(--s3);margin-bottom:var(--s4);flex-wrap:wrap}
.actions{display:flex;flex-wrap:wrap;align-items:center;gap:var(--s2)}
.reveal{transition:opacity 700ms var(--ease-out),transform 900ms var(--spring-soft),filter 700ms var(--ease-out)}
.reveal.pre{opacity:0;transform:var(--rise);filter:var(--reveal-blur)}

/* controls: every label sits at the exact center of its control */
.btn{position:relative;display:inline-flex;align-items:center;justify-content:center;gap:var(--s2);height:48px;padding:0 var(--s5);border-radius:999px;font-size:.9375rem;line-height:1;font-weight:680;white-space:nowrap}

  pop.style.transformOrigin = `${r.left + r.width / 2 - left}px -8px`;
  if (!reduced.matches) pop.animate([{ opacity: 0, transform: "scale(.9)" }, { opacity: 1, transform: "none" }], { duration: 460, easing: SNAPPY });
  popTrigger = trigger; trigger.setAttribute("aria-expanded", "true");
  $(".mi", pop)?.focus({ preventScroll: true });
}
function closePopover(instant) {
  if (!popTrigger) return;
  popTrigger.setAttribute("aria-expanded", "false"); popTrigger = null;
  if (instant || reduced.matches) { pop.hidden = true; return; }
  pop.animate([{ opacity: 1, transform: "none" }, { opacity: 0, transform: "scale(.96)" }], { duration: 150, easing: EASE_IN }).finished.then(() => { if (!popTrigger) pop.hidden = true; });
}
function menu(trigger, items, title) {
  const list = items.map(([ic, label, action, extra = "", on = false]) => `<button class="mi press" type="button" role="menuitem" data-action="${action}" ${extra}>${icon(ic)}<span>${label}</span>${on ? icon("check", "check") : ""}</button>`).join("");
  if (desktop.matches) openPopover(trigger, `<div class="menu" role="menu">${list}</div>`);
  else openSheet(`<h2 class="headline" id="sheetTitle">${title}</h2><div class="menu" role="menu">${list}</div>`);
}

/* ---------- sheets' content ---------- */
function playerSheet(id) {
  const rows = sorted(), i = rows.findIndex(r => r.id === id), r = rows[i];
  const wins = TOURNEYS.slice(1).filter(t => champion(t) === id).length;
  return `<header class="ps-head"><p class="eyebrow">Trainer</p><h2 class="title" id="sheetTitle">${NAMES[id]}</h2><p class="caption">${SEASONS[S.season].label} ${i + 1}위</p></header>
  <div class="stats"><div class="stat glass-lite"><span class="caption">포인트</span><span class="v num">${rollHTML(r.pts)}</span></div><div class="stat glass-lite"><span class="caption">출전</span><span class="v num">${r.played}</span></div><div class="stat glass-lite"><span class="caption">우승</span><span class="v num">${wins}</span></div></div>
  <section><h3 class="sub-h">최근 대회</h3><ul class="hist glass-lite">${TOURNEYS.slice(1).map(t => `<li><span>${t.name}</span><span class="caption">${placement(t, id)}</span></li>`).join("")}</ul></section>
  <button class="btn glass-lite press" type="button" data-action="close-sheet">닫기</button>`;
}

/* ---------- actions ---------- */
function setHero(v) {
  S.heroState = v; S.decided = { open: 0, live: 5, done: 7 }[v]; S.lastDecided = v === "live" ? 4 : -1;
  stage.dataset.state = v;
  const box = $("#heroIn"); if (box) swap(box, heroContent());
  if (v === "done") setTimeout(() => celebrate(...centerOf($("#heroCard"))), 120);
}
const ACTIONS = {
  apply() {
    if (S.applied >= 32) { toast("신청 인원이 모두 찼습니다.", "info"); return; }
    S.applied++; setRoll($(".pg-num .roll", main), S.applied); $("#applyBar")?.style.setProperty("--p", S.applied / 32);
    toast("참가 신청을 접수했습니다."); try { navigator.vibrate?.(12); } catch {}
  },
  "open-bracket"(btn) { go("bracket", { tid: btn.dataset.tid, shared: `t-${btn.dataset.tid}`, from: S.page === "home" ? "home" : null }); },
  "back-home"() { go("home", { dir: "back", shared: `t-${S.tid}` }); },
  "open-article"(btn) { go("news", { sub: btn.dataset.id, shared: `n-${btn.dataset.id}` }); },
  "back-news"() { go("news", { dir: "back", shared: `n-${S.sub}` }); },
  advance() {
    if (S.decided >= 7) return;
    const i = S.decided; S.decided++; S.lastDecided = i;
    S.heroState = S.decided >= 7 ? "done" : "live"; stage.dataset.state = S.heroState;
    drawBracket(i);
    if (i === 6) { const f = bracket(TOURNEYS[0], 7)[6]; setTimeout(() => celebrate(...centerOf($('[data-m="6"]'))), 380); toast(`${NAMES[f[f.w]]} 트레이너의 우승이 확정되었습니다.`, "trophy"); }
    const adv = $('[data-action="advance"]', main); if (adv) adv.disabled = S.decided >= 7;
    const chip = $(".t-head .chip", main); if (chip) chip.innerHTML = S.decided >= 7 ? "종료" : '<i class="dot"></i>진행 중';
  },
  "reset-bracket"() { S.decided = 0; S.lastDecided = -1; S.heroState = "live"; stage.dataset.state = "live"; drawBracket(); const adv = $('[data-action="advance"]', main); if (adv) adv.disabled = false; const chip = $(".t-head .chip", main); if (chip) chip.textContent = "대진 공개"; },
  player(btn) { if (!dragged) openSheet(playerSheet(+btn.dataset.id)); },
  season(btn) { menu(btn, Object.entries(SEASONS).map(([k, v]) => ["ranking", v.label, "pick-season", `data-k="${k}" role="menuitemradio" aria-checked="${k === S.season}"`, k === S.season]), "시즌 선택"); },
  "pick-season"(btn) {
    S.season = btn.dataset.k; closePopover(); closeSheet();
    $$('[data-action="season"] span', main).forEach(s => (s.textContent = SEASONS[S.season].label));
    if ($("#tbody")) { S.ranks[S.season].forEach(r => (r.delta = 0)); updateRows(); }
    toast(`${SEASONS[S.season].label} 기록을 보여 줍니다.`);
  },
  award() {
    const rows = S.ranks[S.season], before = new Map(sorted().map((r, i) => [r.id, i]));
    const pick = [...rows].sort(() => Math.random() - 0.5).slice(0, 6), gain = [160, 100, 60, 60, 30, 30];
    rows.forEach(r => (r.delta = 0));
    pick.forEach((r, k) => { r.pts += gain[k]; r.played++; });
    const rise = new Set();
    sorted().forEach((r, i) => { const d = before.get(r.id) - i; if (d > 0) { r.delta = d; rise.add(r.id); } });
    updateRows(rise);
  },
  more(btn) { menu(btn, MORE.map(([ic, l]) => [ic, l, "menu-item", `data-l="${l}"`]), "더보기"); },
  "menu-item"(btn) { closePopover(); closeSheet(); toast(`${btn.dataset.l} 화면은 페이지 이식 단계에서 만듭니다.`, "info"); },
  "close-sheet"() { closeSheet(); },
  toast() { toast("글래스 토스트입니다. 아래에서 스프링으로 올라옵니다."); },
  "toast-many"() { ["첫 번째 알림", "두 번째 알림", "세 번째 알림"].forEach((m, i) => setTimeout(() => toast(m), i * 260)); },
  celebrate(btn) { celebrate(...centerOf(btn.closest(".card") || btn)); },
  async copy(btn) {
    const recipe = "/* YPL Glass L2 (dark) */\nbackground: linear-gradient(180deg, rgb(255 255 255 / .1), transparent 60%), rgb(30 30 30 / .36);\nbackdrop-filter: blur(20px) saturate(180%) brightness(1.14);\nbox-shadow: inset 0 1px 0 rgb(255 255 255 / .2), inset 0 -1px 0 rgb(255 255 255 / .08), 0 1px 1px rgb(0 0 0 / .4), 0 18px 40px -14px rgb(0 0 0 / .7);\n/* rim: 1px, bright at the top, clear in the middle, lit again at the bottom */";
    try { await navigator.clipboard.writeText(recipe); btn.classList.add("done"); setTimeout(() => btn.classList.remove("done"), 1600); }
    catch { toast("이 화면에서는 클립보드를 쓸 수 없습니다.", "x"); }
  },
  "logo-replay"() { for (const l of $$(".logo-xl, #navLogo .logo")) { l.classList.remove("enter"); l.offsetWidth; l.classList.add("enter"); } },
  "logo-load"(btn) { S.logoLoading = !S.logoLoading; $(".logo-xl", main)?.classList.toggle("loading", S.logoLoading); btn.setAttribute("aria-pressed", S.logoLoading); btn.textContent = S.logoLoading ? "불러오기 멈추기" : "불러오는 중 보기"; },
  "res-load"() { loadResults(1400, "ok"); },
  "res-fail"() { loadResults(900, "error"); },
  "res-retry"() { loadResults(1200, "ok"); },
  num(btn) { const el = $("#bigNum .roll"), v = +el.dataset.v, d = btn.dataset.d; setRoll(el, Math.max(0, d === "r" ? Math.floor(Math.random() * 9000) + 300 : v + +d)); },
};
function loadResults(ms, end) {
  const box = $("#resBox"); if (!box) return;
  S.res = "loading"; swap(box, resultHTML());
  clearTimeout(loadResults.t); loadResults.t = setTimeout(() => { S.res = end; if ($("#resBox")) swap($("#resBox"), resultHTML()); }, ms);
}
function segChange(box, v) {
  const name = box.dataset.seg;
  if (name === "hero") setHero(v);
  if (name === "material") root.classList.toggle("cards-glass", v === "glass");
}

/* ---------- theme with a circular reveal from the tap (B6) ---------- */
const isDark = () => (root.dataset.theme ? root.dataset.theme === "dark" : sysDark.matches);
function themeIcon() { $("#themeBtn").innerHTML = `<span class="theme-ic">${icon("sun", "i-sun")}${icon("moon", "i-moon")}</span>`; $("#themeBtn").setAttribute("aria-label", isDark() ? "라이트 테마로 바꾸기" : "다크 테마로 바꾸기"); }
let flipping = false;
$("#themeBtn").addEventListener("click", e => {
  if (flipping) return;
  const next = isDark() ? "light" : "dark";
  const commit = () => {
    root.classList.add("no-tx"); root.dataset.theme = next; themeIcon();
    try { localStorage.setItem("ypl-lab-theme", next); } catch {}
    requestAnimationFrame(() => requestAnimationFrame(() => root.classList.remove("no-tx")));
  };
  flipping = true;
  const layer = document.createElement("div");
  layer.className = `theme-flip theme-${next}`; layer.setAttribute("aria-hidden", "true");
  const put = el => {
    if (!el || el.hidden || !el.getClientRects().length || el.classList.contains("hide")) return;
    const r = el.getBoundingClientRect(), c = el.cloneNode(true);
    c.removeAttribute("id"); $$("[id]", c).forEach(n => n.removeAttribute("id"));
    Object.assign(c.style, { position: "absolute", left: r.left + "px", top: r.top + "px", width: r.width + "px", height: r.height + "px", margin: "0", right: "auto", bottom: "auto" });
    layer.append(c);
  };
  const st = stage.cloneNode(true); st.removeAttribute("id"); st.style.position = "absolute"; layer.append(st);
  $$(".light", stage).forEach((o, i) => { const a = o.getAnimations().find(a => a.animationName); if (a) $$(".light", st)[i].style.animationDelay = -a.currentTime + "ms"; });
  [main, topbar, tabbar].forEach(put);
  document.body.append(layer);
  const x = e.clientX || innerWidth - 40, y = e.clientY || 40, r = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
  const a = reduced.matches
    ? layer.animate([{ opacity: 0 }, { opacity: 1 }], { duration: 260, easing: EASE_OUT })
    : layer.animate({ clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${r}px at ${x}px ${y}px)`] }, { duration: 640, easing: EASE_OUT });
  a.finished.then(() => { commit(); requestAnimationFrame(() => { layer.remove(); flipping = false; }); });
});

/* ---------- SUIT tabular figures check (E1, E4) ---------- */
function tnumCheck() {
  if (!$("#tnumResult")) return;
  (document.fonts?.load ? document.fonts.load('700 22px "SUIT Variable"') : Promise.resolve()).then(() => {
    const probe = s => { const e = document.createElement("span"); e.textContent = s; e.style.cssText = 'position:absolute;visibility:hidden;font:700 22px "SUIT Variable";font-variant-numeric:tabular-nums;white-space:nowrap'; document.body.append(e); const w = e.getBoundingClientRect().width; e.remove(); return w; };
    const w = [..."0123456789"].map(probe), ok = Math.max(...w) - Math.min(...w) < 0.3;
    const loaded = document.fonts?.check ? document.fonts.check('700 22px "SUIT Variable"') : false;
    if ($("#tnumResult")) $("#tnumResult").textContent = !loaded ? "SUIT를 불러오지 못해 확인할 수 없습니다." : ok ? "SUIT는 고정폭 숫자를 지원합니다. 오른쪽 숫자의 자릿수가 세로로 맞습니다." : "SUIT는 고정폭 숫자를 지원하지 않습니다. E4의 대안이 필요합니다.";
  });
}

/* ---------- wiring ---------- */
document.addEventListener("click", e => {
  const t = e.target.closest("[data-action],[data-tab],.seg>button");
  if (!t) { if (popTrigger && !e.target.closest("#popover")) closePopover(); return; }
  if (t.matches(".seg>button")) {
    const box = t.parentElement; if (t.getAttribute("aria-pressed") === "true") return;
    $$("button", box).forEach(b => b.setAttribute("aria-pressed", b === t)); placeInd(box, true); segChange(box, t.dataset.v); return;
  }
  if (t.dataset.tab) {
    const tab = t.dataset.tab;
    if (tab === "more") { ACTIONS.more(t); return; }
    if (tab === S.page && !S.sub) { scrollTo({ top: 0, behavior: reduced.matches ? "auto" : "smooth" }); return; }
    go(tab, { dir: tab === S.page ? "back" : "forward", shared: tab === S.page && S.sub ? `n-${S.sub}` : undefined });
    return;
  }
  if (popTrigger && !t.closest("#popover") && t !== popTrigger) closePopover();
  ACTIONS[t.dataset.action]?.(t, e);
});
document.addEventListener("input", e => { if (e.target.id !== "q") return; S.query = e.target.value; updateRows(); });
document.addEventListener("keydown", e => { if (e.key === "Escape") { if (sheetOpen) closeSheet(); else closePopover(); } });
document.addEventListener("touchstart", () => {}, { passive: true });
document.addEventListener("pointermove", e => {
  if (e.pointerType !== "mouse") return;
  const el = e.target.closest?.(".hl"); if (!el) return;
  const r = el.getBoundingClientRect(); el.style.setProperty("--mx", e.clientX - r.left + "px"); el.style.setProperty("--my", e.clientY - r.top + "px");
}, { passive: true });
let rz = 0;
addEventListener("resize", () => { cancelAnimationFrame(rz); rz = requestAnimationFrame(() => { setNav(false); $$(".seg", main).forEach(s => placeInd(s, false)); if (S.page === "bracket") drawBracket(); }); });

(function init() {
  try { const th = localStorage.getItem("ypl-lab-theme"); if (th) root.dataset.theme = th; } catch {}
  try {
    // dither at device resolution, about one level of 255: it stops banding in the stage light and cannot be seen (C6)
    const k = Math.min(3, Math.round(devicePixelRatio || 1)), n = 128 * k, c = document.createElement("canvas"); c.width = c.height = n;
    const x = c.getContext("2d"), d = x.createImageData(n, n);
    for (let i = 0; i < d.data.length; i += 4) { const v = (Math.random() * 255) | 0; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 3; }
    x.putImageData(d, 0, 0); root.style.setProperty("--grain", `url(${c.toDataURL()})`);
  } catch {}
  const tabHTML = ([k, l, ic]) => `<button class="tab press" type="button" data-tab="${k}"${k === "more" ? ' aria-haspopup="menu" aria-expanded="false"' : ""}><span class="ics">${icon(ic, "ic-off")}${icon(ic + "-fill", "ic-on")}</span><span>${l}</span></button>`;
  tabbar.insertAdjacentHTML("beforeend", TABS.map(tabHTML).join(""));
  navlinks.insertAdjacentHTML("beforeend", TABS.map(([k, l]) => `<button class="navlink press" type="button" data-tab="${k}"${k === "more" ? ' aria-haspopup="menu" aria-expanded="false"' : ""}>${l}</button>`).join(""));
  $("#navLogo").innerHTML = logoSVG("enter");
  stage.dataset.state = S.heroState;
  themeIcon(); render(); arm(); setNav(false);
})();
</script>
