<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>YPL scoreboard drafts</title>
<style>
@font-face { font-family: "Albert Sans"; src: url("../../public/fonts/albert-sans-latin-wght.woff2") format("woff2"); font-weight: 100 900; unicode-range: U+0000-00FF, U+2000-206F, U+2190-2193; }
@font-face { font-family: "Freesentation"; src: url("../../public/fonts/freesentation/Freesentation-4Regular.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Freesentation"; src: url("../../public/fonts/freesentation/Freesentation-6SemiBold.woff2") format("woff2"); font-weight: 600; }
@font-face { font-family: "Freesentation"; src: url("../../public/fonts/freesentation/Freesentation-7Bold.woff2") format("woff2"); font-weight: 700; }
/* the scoreboard: a navy ground, lifted panels, and three levels of light on them */
:root {
  --ground: #081C3D; --panel: #0E2449; --panel-2: #132B54; --ghost: #16305B; --rule: #1D365F;
  --lit: #FFFFFF; --dim: #93A6C6; --mute: #5F7499; --signal: #FFB21A;
  --font: "Albert Sans", "Freesentation", sans-serif;
}
.light {
  --ground: #FFFFFF; --panel: #EEF1F6; --panel-2: #E4E8EF; --ghost: #E3E7EE; --rule: #D9DEE7;
  --lit: #081C3D; --dim: #56647D; --mute: #8C96A8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: #D5DAE3; -webkit-font-smoothing: antialiased; word-break: keep-all; }
.board { display: inline-block; padding: 84px; background: #E3E7EE; color: #081C3D; }
.board > h1 { font-size: 32px; font-weight: 700; letter-spacing: -.01em; }
.board > p.lede { margin-top: 12px; font-size: 16px; line-height: 1.6; color: #5B6880; max-width: 1180px; }
.row { display: flex; gap: 52px; margin-top: 52px; align-items: flex-start; }
.cap { margin-top: 20px; font-size: 13px; font-weight: 600; color: #5B6880; }
.ph { position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--ground); color: var(--lit); }
.abs { position: absolute; }
.num { font-family: "Albert Sans"; font-variant-numeric: tabular-nums; font-weight: 700; letter-spacing: -.02em; }
.k { font-family: "Freesentation"; letter-spacing: 0; }
.lab { font-size: 12px; font-weight: 600; color: var(--dim); letter-spacing: .01em; }
.mute { color: var(--mute); }
.pn { background: var(--panel); }
.pn2 { background: var(--panel-2); }
/* a figure on the board: unlit 8s stand behind the lit digits */
.fig { display: inline-flex; line-height: .82; }
.fig .d { position: relative; display: inline-block; width: .6em; text-align: center; }
.fig .d::before { content: "8"; position: absolute; inset: 0; color: var(--ghost); z-index: 0; }
.fig .d > b { position: relative; z-index: 1; font-weight: inherit; }
.lamp { display: inline-block; width: 8px; height: 8px; background: var(--lit); vertical-align: middle; }
.lamp.sig { background: var(--signal); }
.bar { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-shadow: inset 0 -1px 0 var(--rule); }
.brand { display: flex; align-items: center; gap: 8px; flex: none; color: var(--lit); }
.tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--ground); box-shadow: inset 0 1px 0 var(--rule); }
.tabs a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--mute); position: relative; }
.tabs a.on { color: var(--lit); font-weight: 700; }
.tabs a.on::before { content: ""; position: absolute; top: 0; left: 50%; width: 32px; margin-left: -16px; height: 2px; background: var(--lit); }
.btn { display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 20px; font-size: 16px; font-weight: 700; background: var(--lit); color: var(--ground); }
.link { font-size: 13px; font-weight: 600; color: var(--lit); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
.sh { display: flex; justify-content: space-between; align-items: baseline; padding: 0 20px; }
.sh h2 { font-size: 20px; font-weight: 700; }
.grid { display: grid; gap: 2px; margin: 0 20px; }
.sprite { position: absolute; object-fit: contain; }
.desk { position: relative; width: 1440px; height: 900px; overflow: hidden; background: var(--ground); color: var(--lit); }
.sb { display: flex; gap: 32px; margin-top: 32px; }
.sb .fr { width: 234px; }
.sb .mini { width: 234px; height: 506px; overflow: hidden; position: relative; }
.sb .mini > .ph { transform: scale(.6); transform-origin: 0 0; }
.sb .t { margin-top: 12px; font-size: 13px; font-weight: 700; } .sb .s { margin-top: 4px; font-size: 12px; line-height: 1.5; color: #5B6880; }
.sb-title { margin-top: 52px; font-size: 20px; font-weight: 700; }
.spec { display: grid; grid-template-columns: repeat(4, 1fr); gap: 32px; margin-top: 52px; }
.spec h3 { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
.spec p { font-size: 13px; line-height: 1.6; color: #5B6880; }
.sw { display: flex; gap: 2px; margin-bottom: 12px; }
.sw i { width: 52px; height: 52px; display: block; }
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="wing" viewBox="0 0 1315.1 870.6"><path fill="currentColor" d="M0 0 L427.7 118 L657.5 430 L887.4 118 L1315.1 0 L1199.8 164 L947.9 233.5 L755.3 495.5 L755.3 536.5 L559.8 536.5 L559.8 495.5 L367.1 233.5 L115.3 164 Z M246.8 351.1 L149.5 212.7 L403.3 282.8 L506.3 422.7 Z M808.8 422.7 L911.7 282.8 L1165.6 212.7 L1068.3 351.1 Z M559.8 574.5 L755.3 574.5 L755.3 608.1 L916.1 732.5 L805.8 811.8 L713.7 639.1 L692.3 639.1 L751.1 811.8 L657.5 870.6 L564 811.8 L622.8 639.1 L601.3 639.1 L509.3 811.8 L399 732.5 L559.8 608.1 Z"/></symbol>
  <symbol id="word" viewBox="0 0 310 100"><path fill="currentColor" fill-rule="evenodd" transform="skewX(-12) translate(21 0)" d="M0 0 H34.7 L55 27.7 L75.3 0 H110 L69 56 V100 H41 V56 Z M118 0 H188 A18 18 0 0 1 206 18 V46 A18 18 0 0 1 188 64 H146 V100 H118 Z M146 24 H178 V40 H146 Z M214 0 H242 V76 H286 V100 H214 Z"/></symbol>
</defs></svg>
<div id="root"></div>
<script>
const S = n => `../../public/sprites/pokemon/${n}.webp`;
const I = {
  home: '<path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/>', news: '<path d="M4 9h3l9-4v14l-9-4H4zM7 15l1 5h3l-1-4"/>',
  bracket: '<path d="M3 5h5v4H3zM3 15h5v4H3zM16 10h5v4h-5zM8 7h4v10H8M12 12h4"/>', rec: '<path d="M4 20V11h4v9M10 20V5h4v15M16 20v-6h4v6M2 20h20"/>',
  more: '<path d="M5 12h.01M12 12h.01M19 12h.01"/>', moon: '<path d="M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z"/>', sun: '<circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M5 5l1.5 1.5M17.5 17.5 19 19M5 19l1.5-1.5M17.5 6.5 19 5"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>', search: '<circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/>',
};
const ic = (n, s = 22, w = 1.6) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${n === 'more' ? 3 : w}" stroke-linecap="square">${I[n]}</svg>`;
const brand = (h = 20) => `<span class="brand"><svg width="${h * 1.51}" height="${h}"><use href="#wing"/></svg><svg width="${h * 2.6}" height="${h * .84}"><use href="#word"/></svg></span>`;
const bar = (light) => `<header class="bar">${brand(20)}<span style="color:var(--lit)">${ic(light ? 'sun' : 'moon', 22)}</span></header>`;
const tabs = on => `<nav class="tabs">${[['home','홈'],['news','공지'],['bracket','대진표'],['rec','기록'],['more','더보기']].map(([k, l]) => `<a class="${k === on ? 'on' : ''}">${ic(k)}<span>${l}</span></a>`).join('')}</nav>`;
/* a figure with its unlit 8s behind; digits only are ghosted */
const hero = (size, inner = '5', color = '') => `<span class="num" style="display:inline-flex;font-size:${size}px;line-height:.82;letter-spacing:-.045em;${color}">D-<span style="display:inline-block;height:.82em;overflow:hidden"><span style="display:block">${inner}</span></span></span>`;
const fig = (v, size, extra = '') => `<span class="fig num" style="font-size:${size}px;${extra}">${[...String(v)].map(c => /[0-9]/.test(c) ? `<span class="d"><b>${c}</b></span>` : c).join('')}</span>`;

/* ================================ phone 1: home ================================ */
const home = (light) => `<div class="ph ${light ? 'light' : ''}">
  ${bar(light)}
  <div class="abs" style="left:20px;right:20px;top:80px;display:flex;justify-content:space-between;align-items:center">
    <span class="lab"><span class="lamp" style="margin-right:8px"></span>다음 대회</span><span class="lab num" style="font-size:13px">11.07 <span class="k">토</span></span>
  </div>
  <div class="abs" style="left:16px;top:112px">${hero(136)}</div>
  <div class="abs" style="left:20px;top:248px;font-size:20px;font-weight:700;line-height:1.35">37회 파이컵 마스터 리그<br>NPC 배틀 7</div>
  <a class="btn abs" style="left:20px;right:20px;top:326px">이번 대회 신청 ${ic('arrow', 20, 2)}</a>
  <div class="grid abs" style="left:0;right:0;top:410px;grid-template-columns:132px 216px">
    <div class="pn" style="height:216px;padding:16px;display:flex;flex-direction:column;justify-content:space-between">
      <div class="lab">현 챔피언</div>
      <div><div class="num" style="font-size:13px;color:var(--dim)">6<span class="k" style="margin-left:2px">대</span></div><div style="font-size:24px;font-weight:700;margin-top:4px">김현민</div><div class="lab" style="margin-top:4px;font-weight:400">YPL 시즌 2 우승</div></div>
    </div>
    <div class="pn2" style="height:216px;position:relative"><img class="sprite" src="${S('garchomp')}" style="inset:12px;width:192px;height:192px"></div>
  </div>
  <div class="grid abs" style="left:0;right:0;top:628px;grid-template-columns:repeat(3,1fr)">
    ${[['59','대회'],['71','트레이너'],['6','챔피언']].map(([n, l]) => `<div class="pn" style="height:84px;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between"><span class="lab">${l}</span>${fig(n, 32)}</div>`).join('')}
  </div>
  ${tabs('home')}
</div>`;

/* ================================ phone 2: home, lower ================================ */
const notices = [['10.28','수','제38회 파이컵 공지'],['10.01','목','37회 파이컵 팀전 팀 편성 안내'],['09.19','토','37회 파이컵 팀전 리전 워즈']];
const homeLow = `<div class="ph">
  ${bar()}
  <div class="sh" style="margin-top:24px"><h2>YPL 시즌 3 순위</h2><span class="link">전체 보기</span></div>
  <div class="grid" style="margin-top:12px;grid-template-columns:84px 1fr 84px">
    <div class="pn" style="grid-row:span 3;padding:12px;display:flex;flex-direction:column;justify-content:space-between"><span class="lab">공동</span>${fig(1, 52)}</div>
    ${['이상준','이준혁','양승규'].map(n => `<div class="pn" style="height:52px;display:flex;align-items:center;padding:0 16px;font-size:17px;font-weight:700">${n}</div><div class="pn" style="height:52px;display:flex;align-items:center;justify-content:flex-end;gap:4px;padding:0 14px">${fig(30, 24)}<span class="lab k">점</span></div>`).join('')}
  </div>
  <div class="sh" style="margin-top:32px"><h2>공지</h2><span class="link">전체 보기</span></div>
  <div class="grid" style="margin-top:12px;grid-template-columns:84px 1fr">
    ${notices.map(([d, w, t], i) => `<div class="pn" style="height:52px;padding:0 12px;display:flex;align-items:center;gap:4px"><span class="num" style="font-size:16px">${d}</span><span class="lab">${w}</span></div><div class="pn" style="height:52px;padding:0 16px;display:flex;align-items:center;font-size:15px;font-weight:600">${i === 0 ? '<span class="lamp" style="margin-right:10px"></span>' : ''}${t}</div>`).join('')}
  </div>
  <div class="sh" style="margin-top:32px"><h2>역대 챔피언</h2><span class="link">명예의 전당</span></div>
  <div style="display:flex;gap:2px;margin:12px 0 0 20px">
    ${[['정두호','5','lickilicky'],['이제빈','4','abomasnow-mega'],['허진욱','3','kingambit']].map(([n, g, s]) => `<div style="flex:none;width:134px"><div class="pn2" style="height:134px;position:relative"><img class="sprite" src="${S(s)}" style="inset:14px;width:106px;height:106px"><span class="abs" style="left:10px;top:8px">${fig(g, 24)}</span></div><div class="pn" style="height:40px;display:flex;align-items:center;padding:0 12px;font-size:14px;font-weight:700">${n}</div></div>`).join('')}
  </div>
  ${tabs('home')}
</div>`;

/* ================================ phone 3: bracket on the day ================================ */
const match = (no, a, b, sa, sb, state) => {
  const win = state === 'done' ? (sa > sb ? 0 : 1) : -1;
  const rowS = (name, seed, sc, i) => {
    const w = win === i, l = win !== -1 && !w;
    return `<div style="display:grid;grid-template-columns:32px 1fr 52px;height:48px;align-items:center;${w ? 'background:var(--lit);color:var(--ground)' : ''}">
      <span class="num" style="font-size:12px;padding-left:12px;${w ? '' : 'color:var(--mute)'}">${seed}</span>
      <span style="font-size:16px;font-weight:700;${l ? 'color:var(--mute)' : ''}">${name}</span>
      <span style="text-align:right;padding-right:14px">${sc === null ? '<span class="num" style="font-size:20px;color:var(--ghost)">8</span>' : w ? `<span class="num" style="font-size:24px">${sc}</span>` : fig(sc, 24, l ? 'color:var(--mute)' : '')}</span></div>`;
  };
  return `<div class="pn" style="position:relative">
    <div style="display:flex;justify-content:space-between;align-items:center;height:32px;padding:0 12px;box-shadow:inset 0 -1px 0 var(--rule)"><span class="lab num">M${no}</span><span class="lab">${state === 'live' ? '<span class="lamp sig" style="margin-right:6px"></span>진행 중' : state === 'done' ? '종료' : '대기'}</span></div>
    ${rowS(a[0], a[1], sa, 0)}<div style="height:1px;background:var(--rule)"></div>${rowS(b[0], b[1], sb, 1)}
  </div>`;
};
const bracket = `<div class="ph">
  ${bar()}
  <div style="height:36px;display:flex;align-items:center;gap:10px;padding:0 20px;background:var(--panel)"><span class="lamp sig"></span><span style="font-size:13px;font-weight:700">오늘 대회 진행 중</span><span class="lab" style="margin-left:auto">8강 4경기 중 2경기 종료</span></div>
  <div style="padding:24px 20px 0"><div class="lab">대진표</div><div style="font-size:24px;font-weight:700;margin-top:6px;line-height:1.3">37회 파이컵 마스터 리그<br>NPC 배틀 7</div></div>
  <div style="display:flex;margin:20px 20px 0;box-shadow:inset 0 -1px 0 var(--rule)">${['8강','4강','결승'].map((t, i) => `<a style="padding:12px 0;margin-right:28px;font-size:16px;font-weight:${i ? 600 : 700};color:${i ? 'var(--mute)' : 'var(--lit)'};${i ? '' : 'box-shadow:inset 0 -2px 0 var(--lit)'}">${t}</a>`).join('')}<span class="lab" style="margin-left:auto;align-self:center">예시 데이터</span></div>
  <div class="grid" style="margin-top:16px;grid-template-columns:1fr">
    ${match(1, ['정두호', 1], ['김다온', 8], 2, 0, 'done')}
    ${match(2, ['이종우', 4], ['김원의', 5], 1, 2, 'done')}
    ${match(3, ['김현민', 2], ['이준영', 7], 1, 1, 'live')}
    ${match(4, ['이병재', 3], ['이제빈', 6], null, null, 'wait')}
  </div>
  ${tabs('bracket')}
</div>`;

/* ================================ phone 4: records ================================ */
const records = [['정두호',8,6,8],['이종우',5,2,7],['김현민',4,3,2],['이병재',3,1,5],['허진욱',3,0,5],['이준영',2,3,7],['김원의',2,3,6],['이제빈',2,2,9]];
const recs = `<div class="ph">
  ${bar()}
  <div style="padding:24px 20px 0;display:flex;justify-content:space-between;align-items:flex-end"><h1 style="font-size:52px;font-weight:700;letter-spacing:-.02em;line-height:1">기록</h1><span class="lab">2023년 5월부터</span></div>
  <div class="grid" style="margin-top:20px;grid-template-columns:repeat(3,1fr)">
    ${[['71','트레이너'],['59','대회'],['359','포켓몬']].map(([n, l]) => `<div class="pn" style="height:84px;padding:12px 14px;display:flex;flex-direction:column;justify-content:space-between"><span class="lab">${l}</span>${fig(n, 32)}</div>`).join('')}
  </div>
  <div style="display:flex;gap:28px;margin:16px 20px 0;box-shadow:inset 0 -1px 0 var(--rule)">${['트레이너','대회','포켓몬','랭킹'].map((t, i) => `<a style="padding:12px 0;font-size:16px;font-weight:${i ? 600 : 700};color:${i ? 'var(--mute)' : 'var(--lit)'};${i ? '' : 'box-shadow:inset 0 -2px 0 var(--lit)'}">${t}</a>`).join('')}</div>
  <div style="margin:12px 20px 8px;height:44px;display:flex;align-items:center;gap:12px;box-shadow:inset 0 -1px 0 var(--dim);font-size:15px;color:var(--mute)">${ic('search', 20)}트레이너 검색</div>
  <div style="display:grid;grid-template-columns:32px 1fr 48px 48px 48px;margin:0 20px;height:32px;align-items:center" class="lab"><span>#</span><span>트레이너</span><span style="text-align:right">우승</span><span style="text-align:right">준우승</span><span style="text-align:right">4강</span></div>
  <div class="grid">
    ${records.map((r, i) => `<div class="${i ? 'pn' : ''}" style="display:grid;grid-template-columns:32px 1fr 48px 48px 48px;height:${i ? 44 : 52}px;align-items:center;padding-right:12px;${i ? '' : 'background:var(--lit);color:var(--ground)'}"><span class="num" style="font-size:12px;padding-left:12px;${i ? 'color:var(--mute)' : ''}">${i + 1}</span><b style="font-size:16px">${r[0]}</b>${r.slice(1).map(v => `<span style="text-align:right">${i ? fig(v, 18, v === 0 ? 'color:var(--mute)' : '') : `<span class="num" style="font-size:20px">${v}</span>`}</span>`).join('')}</div>`).join('')}
  </div>
  ${tabs('rec')}
</div>`;

/* ================================ desktop ================================ */
const desk = `<div class="desk">
  <div style="height:64px;display:flex;align-items:center;padding:0 120px;gap:52px;box-shadow:inset 0 -1px 0 var(--rule)">${brand(24)}<nav style="display:flex;gap:32px;font-size:15px;font-weight:600;color:var(--mute)">${['홈','공지','대진표','기록','칭호','명예의 전당','게시판','팀 빌더','계산기','소개'].map((t, i) => `<a style="${i ? '' : 'color:var(--lit);box-shadow:inset 0 -2px 0 var(--lit);padding-bottom:6px;margin-bottom:-8px'}">${t}</a>`).join('')}</nav><span style="margin-left:auto">${ic('moon', 22)}</span></div>
  <div class="abs" style="left:120px;top:104px;width:720px;display:flex;justify-content:space-between"><span class="lab" style="font-size:13px"><span class="lamp" style="margin-right:10px"></span>다음 대회</span><span class="lab num" style="font-size:15px">11.07 <span class="k">토</span></span></div>
  <div class="abs" style="left:112px;top:140px">${hero(272)}</div>
  <div class="abs" style="left:120px;top:400px;font-size:32px;font-weight:700;line-height:1.3">37회 파이컵 마스터 리그 NPC 배틀 7</div>
  <div class="abs" style="left:120px;top:460px;display:flex;gap:32px;align-items:center"><a class="btn" style="width:280px">이번 대회 신청 ${ic('arrow', 20, 2)}</a><span class="link" style="font-size:15px">리그 소개</span></div>
  <div class="abs" style="left:120px;top:560px;width:720px">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:20px;font-weight:700">YPL 시즌 3 순위</span><span class="link">전체 보기</span></div>
    <div class="grid" style="margin:12px 0 0;grid-template-columns:134px 1fr 134px">

  const veil = stage === 0 ? 72 : stage === 1 ? 240 : stage === 2 ? 620 : null;
  return veil ? h.replace('${tabs', '').replace(/<nav class="tabs">/, `${`<div class="abs" style="left:0;right:0;top:${veil}px;height:${716 - veil}px;background:#081C3D;opacity:.9;z-index:5"></div>`}<nav class="tabs">`) : h;

const matchAt = (p) => {

  ${tabs('bracket')}</div>`;
};

const boardHTML = (title, lede, items, extra = '') => `<section class="board"><h1>${title}</h1><p class="lede">${lede}</p><div class="row">${items.map(([cap, html]) => `<div>${html}<div class="cap">${cap}</div></div>`).join('')}</div>${extra}</section>`;

  <div><h3>세 단계의 빛</h3><div class="sw"><i style="background:#FFFFFF"></i><i style="background:#93A6C6"></i><i style="background:#5F7499"></i><i style="background:#16305B"></i></div><p>켜짐, 흐림, 꺼짐, 그리고 꺼진 숫자 8. 상태는 색이 아니라 빛의 세기로 읽힙니다. 이긴 쪽은 반전되어 가장 밝게 켜집니다.</p></div>
  <div><h3>숫자</h3><p style="margin-bottom:12px">${'<span style="font:700 52px/1 Albert Sans;color:#081C3D;letter-spacing:-.02em;position:relative;display:inline-block"><span style="position:absolute;color:#C9D1DE">88</span><span style="position:relative">59</span></span>'}</p><p>Albert Sans 700, 고정폭 숫자. 큰 숫자 뒤에는 꺼진 8이 섭니다. 크기는 136, 84, 52, 32, 24의 다섯 단계뿐입니다.</p></div>
  <div><h3>신호등</h3><div class="sw"><i style="background:#FFB21A"></i><i style="background:#FFFFFF"></i></div><p>8px 정사각형 램프. 흰 램프는 새것, 호박색 램프는 지금 진행 중인 것에만 켜집니다. 호박색은 사이트 전체에서 이것 하나뿐입니다.</p></div>
</div>`;

const which = new URLSearchParams(location.search).get('b') || '1';
const R = document.getElementById('root');

if (which === '3') R.innerHTML = `<section class="board"><h1>시안 C2. 데스크톱 1440</h1><p class="lede">한 장의 큰 전광판입니다. 왼쪽 742에는 다음 대회와 순위, 오른쪽 440에는 현 챔피언과 파티, 숫자, 공지가 모듈로 붙습니다.</p><div class="row">${desk}</div></section>`;
if (which === '4') {
  const fr = (t, s, html) => `<div class="fr"><div class="mini">${html}</div><div class="t">${t}</div><div class="s">${s}</div></div>`;

    ${fr('0 ms, 꺼진 판', '남색 바탕과 꺼진 8만 HTML과 함께 칠해집니다. 로딩 화면이 없습니다.', homeAt(0))}
    ${fr('120 ms, 숫자 롤', 'D-5가 한 칸 위 숫자에서 굴러 내려와 멈춥니다. 숫자 띠의 translateY 하나, 420ms.', homeAt(1))}
    ${fr('240 ms, 위에서 아래로', '패널이 줄 단위로 38ms 간격을 두고 켜집니다. 위치는 움직이지 않고 밝기만 바뀝니다.', homeAt(2))}
    ${fr('520 ms, 켜짐', '모든 패널이 켜졌습니다. 다시 방문하면 롤과 점등 없이 바로 켜진 판이 섭니다.', home(false))}
  </div>
  <div class="sb-title">경기 결과가 확정될 때</div><div class="sb">
    ${fr('진행 중', '호박색 램프가 켜진 경기만 살아 있습니다. 램프는 깜박이지 않습니다.', matchAt(0))}
    ${fr('점수가 바뀝니다', '바뀐 숫자만 세로로 한 칸 굴러갑니다. 줄 전체가 한 번 밝아졌다 가라앉습니다(opacity).', matchAt(1))}
    ${fr('승자 점등', '이긴 줄이 반전된 흰 패널로 켜지고 진 줄은 흐려집니다. 램프는 꺼집니다.', matchAt(2))}
    ${fr('누름', '패널을 누르면 0.976으로 눌리고, 손을 떼면 같은 자리에서 시트가 아래에서 올라옵니다. 바탕을 어둡게 덮지 않습니다.', bracket)}
