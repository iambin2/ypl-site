<html lang="ko"><head><meta charset="utf-8"><title>YPL scoreboard C5</title>
<link rel="stylesheet" href="c-core.css">
<link rel="stylesheet" href="c-kit.css">
<style>
.ld .ct * { color: transparent !important; }
.ld .ct .seg, .ld .ct .seg * { color: var(--lit) !important; }
.ld .seg .on { opacity: var(--off); }
.ld img, .ld .ct .lamp { opacity: 0; }
.ld .ct .btn { background: var(--panel); }
.box2 { position: absolute; background: var(--panel); }
.box2 > div { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 8px; padding: 0 10px; }
.steps { display: grid; grid-template-columns: repeat(3, 1fr); gap: 2px; margin: 20px 20px 0; }
.steps > span { height: 44px; display: flex; align-items: center; gap: 6px; padding: 0 10px; background: var(--panel); font-size: 12px; font-weight: 600; color: var(--mute); }
.steps > span.on { background: var(--lit); color: var(--ground); font-weight: 700; }
.steps > span.done { color: var(--dim); }
.veil { position: absolute; inset: 0; background: var(--ground); opacity: .72; z-index: 7; }
.sheet { position: absolute; left: 0; right: 0; bottom: 0; background: var(--panel); z-index: 8; box-shadow: inset 0 1px 0 var(--rule); }
.sheet .grip { width: 32px; height: 4px; margin: 8px auto 0; background: var(--mute); }
.dialog { position: absolute; left: 20px; right: 20px; background: var(--panel); z-index: 8; padding: 20px; }
.bang { width: 20px; height: 20px; flex: none; display: grid; place-items: center; background: var(--lit); color: var(--ground); font: 700 13px/1 "Albert Sans"; }
.state { display: grid; gap: 12px; }
.state .lab { font: 600 11px "Albert Sans", "Freesentation"; color: #5B6880; }
.plate { background: #081C3D; padding: 20px; color: #fff; --ground: #081C3D; --panel: #0E2449; --panel-2: #12294F; --rule: #1D365F; --lit: #FFFFFF; --dim: #A8B8D3; --mute: #7A8FB3; --off: .08; }
.ring { box-shadow: inset 0 0 0 2px var(--lit) !important; }
</style></head>

const party = [['garchomp', '한카리아스', '기합의띠'], ['dragonite-mega', '망나뇽', '망나뇽나이트'], ['hydreigon', '삼삼드래', '구애스카프'], ['aegislash', '킬가르도', '먹다남은음식'], ['metagross-mega', '메타그로스', '메타그로스나이트'], ['primarina', '누리레느', '물의주얼']];
const mini = (list, size = 32) => `<span style="display:grid;grid-template-columns:repeat(6,${size}px);gap:2px">${list.map(s => `<span class="pn2" style="height:${size}px;position:relative"><img class="sprite" src="${S(s)}" style="inset:3px;width:${size - 6}px;height:${size - 6}px"></span>`).join('')}</span>`;
const steps = (on, labels) => `<div class="steps">${labels.map((l, i) => `<span class="${i === on ? 'on' : i < on ? 'done' : ''}"><span class="num">${i + 1}</span>${i < on ? ic('check', 14, 2) : ''}${l}</span>`).join('')}</div>`;
const row52 = (inner, cls = 'pn', style = '') => `<div class="${cls}" style="height:52px;display:flex;align-items:center;gap:12px;padding:0 12px;${style}">${inner}</div>`;

/* ================================ bracket tree ================================
   a match is a box of two rows; a column steps by twice the pitch of the one before; the winner's path is lit */
function tree({ x0 = 20, Y0, w = 150, gap = 20, row = 36, vgap = 16, cols, heads = [] }) {
  const h = row * 2 + 1, pitch = h + vgap;
  const X = k => x0 + k * (w + gap), Yc = (k, i) => Y0 + (2 ** k - 1) * pitch / 2 + i * pitch * 2 ** k + h / 2;
  let boxes = '', lines = '';
  cols.forEach((col, k) => col.forEach((m, i) => {
    const top = Yc(k, i) - h / 2;
    const r = ([name, sc], win, empty) => `<div class="${win ? 'inv' : ''}" style="height:${row}px"><span class="t15 ell" style="font-weight:700;${empty ? 'color:var(--mute);font-weight:600;font-size:12px' : ''}${!win && m.done ? ';color:var(--mute)' : ''}">${name}</span><span style="display:flex;align-items:center;gap:8px">${m.live && name === m.a[0] ? '<span class="lamp sig"></span>' : ''}<span class="num t15" style="font-weight:700;${!win && m.done ? 'color:var(--mute)' : ''}">${sc}</span></span></div>`;
    boxes += `<div class="box2" style="left:${X(k)}px;top:${top}px;width:${w}px">${r(m.a, m.win === 0, m.empty)}<div style="height:1px;padding:0;background:var(--rule)"></div>${r(m.b, m.win === 1, m.empty)}</div>`;
    if (k < cols.length - 1) {
      const xa = X(k) + w, xm = xa + gap / 2, ya = Yc(k, i), yb = Yc(k + 1, Math.floor(i / 2));
      const lit = m.win !== undefined;
      lines += `<path d="M${xa} ${ya}H${xm}V${yb}H${X(k + 1)}" fill="none" stroke="${lit ? 'var(--lit)' : 'var(--rule)'}" stroke-width="${lit ? 2 : 1}"/>`;
    }
  }));
  const H = Y0 + cols[0].length * pitch + 40;
  return `${heads.map((t, k) => `<span class="abs t12 dim" style="left:${X(k)}px;top:${Y0 - 28}px">${t}</span>`).join('')}<svg class="abs" style="left:0;top:0;overflow:visible" width="1" height="1">${lines}</svg>${boxes}`;
}
const ex = [

const privates = [['동아리방 내전 3차', '8명, 싱글 엘리미네이션', '진행 중', 1], ['신입 환영 미니대회', '6명, 싱글 엘리미네이션', '11.01 종료'], ['더블 연습 리그', '4명, 더블 엘리미네이션', '10.25 종료'], ['모노타입 번개전', '12명, 싱글 엘리미네이션', '10.18 종료']];

  <div class="stack" style="margin-top:8px;grid-template-columns:repeat(4,1fr)">${[['우승', 30], ['준우승', 20], ['4강', 10], ['8강', 5]].map(([k, v]) => `<div class="pn" style="height:64px;padding:8px 12px;display:flex;flex-direction:column;justify-content:space-between"><span class="t12 dim">${k}</span><span class="num t20">${v}</span></div>`).join('')}</div>`, 'bracket',

const roster = [['김현민', 1, 1], ['이준영', 1, 1], ['정두호', 1, 1], ['이병재', 1, 0], ['이제빈', 1, 1], ['김다온', 0, 1], ['이종우', 1, 1]];
const AB2 = page(`
  ${back('대진표')}
  <div class="sh" style="margin-top:12px;align-items:baseline"><span class="t20">대진표 만들기</span><span class="t12 dim">제38회 파이컵</span></div>
