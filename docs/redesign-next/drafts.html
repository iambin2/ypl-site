<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>YPL redesign drafts</title>
<style>
@font-face { font-family: "Albert Sans"; src: url("../../public/fonts/albert-sans-latin-wght.woff2") format("woff2"); font-weight: 100 900; unicode-range: U+0000-00FF, U+2000-206F, U+2190-2193; }
@font-face { font-family: "Freesentation"; src: url("../../public/fonts/freesentation/Freesentation-4Regular.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Freesentation"; src: url("../../public/fonts/freesentation/Freesentation-6SemiBold.woff2") format("woff2"); font-weight: 600; }
@font-face { font-family: "Freesentation"; src: url("../../public/fonts/freesentation/Freesentation-7Bold.woff2") format("woff2"); font-weight: 700; }
:root {
  --navy: #081C3D; --navy-2: #13274C; --paper: #EEF1F6; --ink: #081C3D; --ink-2: #5B6880; --ink-3: #8C96A8; --line: #DADFE8;
  --on: #FFFFFF; --on-2: #9FB0CC; --on-line: rgba(255,255,255,.14);
  --font: "Albert Sans", "Freesentation", sans-serif;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); color: var(--ink); background: #D5DAE3; -webkit-font-smoothing: antialiased; word-break: keep-all; }
.board { display: inline-block; padding: 84px; background: #E3E7EE; }
.board > h1 { font-size: 32px; font-weight: 700; letter-spacing: -.01em; }
.board > p.lede { margin-top: 12px; font-size: 16px; line-height: 1.6; color: var(--ink-2); max-width: 1100px; }
.row { display: flex; gap: 52px; margin-top: 52px; align-items: flex-start; }
.cap { margin-top: 20px; font-size: 13px; font-weight: 600; color: var(--ink-2); }
.ph { position: relative; width: 390px; height: 844px; overflow: hidden; background: #fff; }
.num { font-family: "Albert Sans"; font-variant-numeric: tabular-nums; font-weight: 700; letter-spacing: -.02em; }
.wing { display: block; }
.abs { position: absolute; }
/* ---------- shared bars ---------- */
.bar { height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; }
.brand { flex: none; } .bar .brand { display: flex; align-items: center; gap: 8px; }
.bar .icons { display: flex; gap: 20px; align-items: center; }
.tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: grid; grid-template-columns: repeat(5, 1fr); background: #fff; box-shadow: inset 0 1px 0 var(--line); }
.tabs a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; font-weight: 600; color: var(--ink-3); position: relative; }
.tabs a.on { color: var(--ink); font-weight: 700; }
.tabs a.on::before { content: ""; position: absolute; top: 0; left: 50%; width: 32px; margin-left: -16px; height: 2px; background: var(--navy); }
.tabs.dark { background: var(--navy); box-shadow: inset 0 1px 0 var(--on-line); }
.tabs.dark a { color: var(--on-2); } .tabs.dark a.on { color: #fff; } .tabs.dark a.on::before { background: #fff; }
.link { font-size: 13px; font-weight: 600; text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 20px; font-size: 15px; font-weight: 700; background: var(--navy); color: #fff; }
.btn.inv { background: #fff; color: var(--navy); }
.label { font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--ink-2); }
.on .label, .label.on { color: var(--on-2); }
.hair { height: 1px; background: var(--line); }
.sprite { position: absolute; object-fit: contain; }

/* ---------- A: ledger ---------- */
.A .sec-h { display: flex; justify-content: space-between; align-items: baseline; padding: 32px 20px 12px; }
.A .sec-h h2 { font-size: 20px; font-weight: 700; }
.A .list { margin: 0 20px; }
.A .li { display: grid; grid-template-columns: 84px 1fr; align-items: baseline; padding: 16px 0; box-shadow: inset 0 -1px 0 var(--line); }
.A .li .d { font-size: 16px; } .A .li .d small { font-size: 12px; font-weight: 600; color: var(--ink-3); margin-left: 4px; font-family: "Freesentation"; letter-spacing: 0; }
.A .li .t { font-size: 15px; font-weight: 600; line-height: 1.4; }
.A .li .t span { display: block; margin-top: 4px; font-size: 13px; font-weight: 400; color: var(--ink-2); }

/* ---------- B: golden tiling ---------- */
.tile { position: absolute; overflow: hidden; }
.tile.n { background: var(--navy); color: #fff; }
.tile.p { background: var(--paper); }
.tile svg.arc { position: absolute; inset: 0; width: 100%; height: 100%; }

/* ---------- records table, shared by A and B ---------- */
.tbl { margin: 0 20px; }
.tbl .th, .tbl .tr { display: grid; grid-template-columns: 32px 1fr 44px 44px 44px; align-items: center; }
.tbl .th { height: 40px; font-size: 12px; font-weight: 600; color: var(--ink-3); box-shadow: inset 0 -1px 0 var(--line); }
.tbl .th span:nth-child(n+3), .tbl .tr span:nth-child(n+3) { text-align: right; }
.tbl .tr { height: 52px; font-size: 16px; box-shadow: inset 0 -1px 0 var(--line); }
.tbl .tr .rk { font-size: 13px; color: var(--ink-3); }
.tbl .tr .nm { font-weight: 700; font-size: 16px; }
.tbl .tr .z { color: var(--ink-3); }
.tbl .tr.lead { background: var(--navy); color: #fff; margin: 0 -20px; padding: 0 20px; box-shadow: none; height: 56px; }
.tbl .tr.lead .rk { color: var(--on-2); }
.tabsline { display: flex; gap: 28px; margin: 0 20px; box-shadow: inset 0 -1px 0 var(--line); }
.tabsline a { padding: 14px 0; font-size: 16px; font-weight: 600; color: var(--ink-3); }
.tabsline a.on { color: var(--ink); font-weight: 700; box-shadow: inset 0 -2px 0 var(--navy); }
.search { margin: 20px 20px 8px; height: 44px; display: flex; align-items: center; gap: 12px; box-shadow: inset 0 -1px 0 var(--ink); font-size: 15px; color: var(--ink-3); }

/* ---------- C: night board ---------- */
.C { background: var(--navy); color: #fff; }
.C .tl { background: #0E2448; }
.C .hl { box-shadow: inset 0 -1px 0 var(--on-line); }
.C .meta { color: var(--on-2); }

/* ---------- desktop ---------- */
.desk { position: relative; width: 1440px; height: 900px; overflow: hidden; background: #fff; }
.desk .dbar .brand { display: flex; align-items: center; gap: 8px; }
.desk .dbar { height: 64px; background: var(--navy); color: #fff; display: flex; align-items: center; padding: 0 120px; gap: 52px; }
.desk .dbar nav { display: flex; gap: 32px; font-size: 15px; font-weight: 600; color: var(--on-2); }
.desk .dbar nav a.on { color: #fff; box-shadow: inset 0 -2px 0 #fff; padding-bottom: 6px; margin-bottom: -8px; }

/* ---------- motion storyboard ---------- */
.sb { display: flex; gap: 32px; margin-top: 32px; }
.sb .fr { width: 234px; }
.sb .fr .mini { width: 234px; height: 506px; overflow: hidden; position: relative; background: #fff; }
.sb .fr .mini > .ph { transform: scale(.6); transform-origin: 0 0; }
.sb .fr .t { margin-top: 12px; font-size: 13px; font-weight: 700; } .sb .fr .s { margin-top: 4px; font-size: 12px; line-height: 1.5; color: var(--ink-2); }
.sb-row-title { margin-top: 52px; font-size: 20px; font-weight: 700; }
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="wing" viewBox="0 0 1315.1 870.6"><path fill="currentColor" d="M0 0 L427.7 118 L657.5 430 L887.4 118 L1315.1 0 L1199.8 164 L947.9 233.5 L755.3 495.5 L755.3 536.5 L559.8 536.5 L559.8 495.5 L367.1 233.5 L115.3 164 Z M246.8 351.1 L149.5 212.7 L403.3 282.8 L506.3 422.7 Z M808.8 422.7 L911.7 282.8 L1165.6 212.7 L1068.3 351.1 Z M559.8 574.5 L755.3 574.5 L755.3 608.1 L916.1 732.5 L805.8 811.8 L713.7 639.1 L692.3 639.1 L751.1 811.8 L657.5 870.6 L564 811.8 L622.8 639.1 L601.3 639.1 L509.3 811.8 L399 732.5 L559.8 608.1 Z"/></symbol>
  <symbol id="word" viewBox="0 0 310 100"><path fill="currentColor" fill-rule="evenodd" transform="skewX(-12) translate(21 0)" d="M0 0 H34.7 L55 27.7 L75.3 0 H110 L69 56 V100 H41 V56 Z M118 0 H188 A18 18 0 0 1 206 18 V46 A18 18 0 0 1 188 64 H146 V100 H118 Z M146 24 H178 V40 H146 Z M214 0 H242 V76 H286 V100 H214 Z"/></symbol>
</defs></svg>

<div id="root"></div>

<script>
const S = n => `../../public/sprites/pokemon/${n}.webp`;
const I = {
  home: '<path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/>',
  news: '<path d="M4 9h3l9-4v14l-9-4H4zM7 15l1 5h3l-1-4"/>',
  bracket: '<path d="M3 5h5v4H3zM3 15h5v4H3zM16 10h5v4h-5zM8 7h4v10H8M12 12h4"/>',
  rec: '<path d="M4 20V11h4v9M10 20V5h4v15M16 20v-6h4v6M2 20h20"/>',
  more: '<path d="M5 12h.01M12 12h.01M19 12h.01"/>',
  moon: '<path d="M20 14A8 8 0 1 1 10 4a6 6 0 0 0 10 10z"/>',
  arrow: '<path d="M5 12h14M13 6l6 6-6 6"/>',
  search: '<circle cx="11" cy="11" r="6"/><path d="m20 20-4.5-4.5"/>',
  menu: '<path d="M4 8h16M4 16h16"/>',
};
const ic = (n, s = 22, w = 1.6) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${n === 'more' ? 3 : w}" stroke-linecap="square">${I[n]}</svg>`;
const brand = (h = 20) => `<span class="brand"><svg class="wing" width="${h * 1.51}" height="${h}"><use href="#wing"/></svg><svg class="wing" width="${h * 2.6}" height="${h * .84}"><use href="#word"/></svg></span>`;
const tabs = (on, dark) => `<nav class="tabs ${dark ? 'dark' : ''}">${[['home','홈'],['news','공지'],['bracket','대진표'],['rec','기록'],['more','더보기']].map(([k, l]) => `<a class="${k === on ? 'on' : ''}">${ic(k)}<span>${l}</span></a>`).join('')}</nav>`;
/* quarter arc inside a tile, centre at one of its corners */
const arc = (w, h, corner, color) => {
  const r = Math.min(w, h), [cx, cy] = { tl: [0, 0], tr: [w, 0], bl: [0, h], br: [w, h] }[corner];
  return `<svg class="arc" viewBox="0 0 ${w} ${h}"><circle cx="${cx}" cy="${cy}" r="${r}" fill="none" stroke="${color}" stroke-width="1"/></svg>`;
};
const T = (x, y, w, h, cls, inner, a) => `<div class="tile ${cls}" style="left:${x + 1}px;top:${y + 1}px;width:${w - 2}px;height:${h - 2}px">${a || ''}${inner}</div>`;

const records = [['정두호',8,6,8],['이종우',5,2,7],['김현민',4,3,2],['이병재',3,1,5],['허진욱',3,0,5],['이준영',2,3,7],['김원의',2,3,6],['이제빈',2,2,9],['이상준',2,2,1],['김다온',2,0,0],['임준하',1,3,1]];
const table = n => `<div class="tbl"><div class="th"><span>#</span><span>트레이너</span><span>우승</span><span>준우승</span><span>4강</span></div>${records.slice(0, n).map((r, i) => `<div class="tr ${i === 0 ? 'lead' : ''}"><span class="rk num">${i + 1}</span><span class="nm">${r[0]}</span>${r.slice(1).map(v => `<span class="num ${v === 0 ? 'z' : ''}">${v}</span>`).join('')}</div>`).join('')}</div>`;
const notices = [['10.28','수','제38회 파이컵 공지','좋아하는 포켓몬 NPC의 파티로 승부하는 NPC 배틀 7이 열립니다.'],['10.01','목','37회 파이컵 팀전 팀 편성 안내',''],['09.19','토','37회 파이컵 팀전 리전 워즈','9개 지역 팀으로 나뉘어 패권을 겨루는 팀전 토너먼트입니다.']];

/* ====================================================== A. 기록부 ====================================================== */
const A1 = `<div class="ph A">
  <header class="bar" style="color:var(--navy)">${brand(20)}<span class="icons">${ic('moon', 22)}</span></header>
  <div style="padding:32px 20px 0">
    <div class="label">포켓몬 센터 연세점 공식 배틀 리그</div>
    <h1 style="margin-top:12px;font-size:40px;line-height:1.18;font-weight:700;letter-spacing:-.02em">모든 승부가<br>기록이 됩니다.</h1>
  </div>
  <div class="abs" style="left:20px;top:240px;width:350px;height:216px;background:var(--navy);color:#fff;padding:20px">
    <div style="display:flex;justify-content:space-between"><span class="label on">다음 대회</span><span class="label on">11월 7일 (토)</span></div>
    <div class="num" style="font-size:84px;line-height:1;margin-top:12px">D-5</div>
    <div style="position:absolute;left:20px;bottom:20px;width:190px;font-size:15px;font-weight:600;line-height:1.4">37회 파이컵 마스터 리그<br>NPC 배틀 7</div>
    <a class="btn inv" style="position:absolute;right:20px;bottom:20px">신청 ${ic('arrow', 18, 2)}</a>
  </div>
  <div class="abs" style="left:20px;top:488px;width:350px">
    <div style="display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:20px;font-weight:700">현 챔피언</span><span class="link">명예의 전당</span></div>
    <div style="display:flex;margin-top:12px;box-shadow:inset 0 1px 0 var(--ink)">
      <div style="position:relative;width:134px;height:134px;background:var(--paper)"><img class="sprite" src="${S('garchomp')}" style="inset:8px;width:118px;height:118px"></div>
      <div style="padding:16px 0 0 20px">
        <div class="label">6대 챔피언</div>
        <div style="font-size:32px;font-weight:700;margin-top:4px;letter-spacing:-.01em">김현민</div>
        <div style="font-size:13px;color:var(--ink-2);margin-top:4px">YPL 시즌 2 우승</div>
      </div>
    </div>
  </div>
  <div class="abs" style="left:20px;top:668px;width:350px;display:grid;grid-template-columns:repeat(3,1fr);box-shadow:inset 0 1px 0 var(--line);padding-top:16px">
    ${[['59','대회'],['71','트레이너'],['6','챔피언']].map(([n, l]) => `<div><div class="num" style="font-size:32px">${n}</div><div class="label" style="margin-top:2px">${l}</div></div>`).join('')}
  </div>
  ${tabs('home')}
</div>`;

const A2 = `<div class="ph A">
  <header class="bar" style="color:var(--navy);box-shadow:inset 0 -1px 0 var(--line)">${brand(20)}<span class="icons">${ic('moon', 22)}</span></header>
  <div class="sec-h" style="padding-top:20px"><h2>공지</h2><span class="link">전체 보기</span></div>
  <div class="list">${notices.map(([d, w, t, s]) => `<div class="li"><span class="num d">${d}<small>${w}</small></span><span class="t">${t}${s ? `<span>${s}</span>` : ''}</span></div>`).join('')}</div>
  <div class="sec-h"><h2>YPL 시즌 3</h2><span class="link">랭킹 전체</span></div>
  <div style="margin:0 20px;display:flex;gap:20px;align-items:stretch;box-shadow:inset 0 1px 0 var(--ink);padding-top:16px">
    <div style="width:134px"><div class="num" style="font-size:52px;line-height:1">30<span style="font-size:16px;margin-left:4px;font-family:Freesentation">점</span></div><div class="label" style="margin-top:8px">공동 1위, 3명</div></div>
    <div style="flex:1">${['이상준','이준혁','양승규'].map(n => `<div style="height:40px;display:flex;align-items:center;font-size:16px;font-weight:700;box-shadow:inset 0 -1px 0 var(--line)">${n}</div>`).join('')}</div>
  </div>
  <div class="sec-h"><h2>역대 챔피언</h2><span class="link">명예의 전당</span></div>
  <div style="margin:0 20px;display:grid;grid-template-columns:1fr 1fr;gap:8px">
    ${[['정두호','5대','YPL 시즌 1','lickilicky'],['이제빈','4대','클래식 시즌 4','abomasnow-mega']].map(([n, g, l, s]) => `<div><div style="position:relative;height:171px;background:var(--paper)"><img class="sprite" src="${S(s)}" style="inset:20px;width:131px;height:131px"></div><div style="display:flex;justify-content:space-between;align-items:baseline;margin-top:12px"><b style="font-size:16px">${n}</b><span class="num" style="font-size:13px;color:var(--ink-2)">${g}</span></div><div style="font-size:12px;color:var(--ink-2);margin-top:2px">${l} 우승</div></div>`).join('')}
  </div>
  ${tabs('home')}
</div>`;

const A3 = `<div class="ph A">
  <header class="bar" style="color:var(--navy)">${brand(20)}<span class="icons">${ic('moon', 22)}</span></header>
  <div style="padding:20px 20px 20px">
    <h1 style="font-size:40px;font-weight:700;letter-spacing:-.02em">기록</h1>
    <div style="font-size:13px;color:var(--ink-2);margin-top:8px">트레이너 71명, 대회 59회</div>
  </div>
  <div class="tabsline"><a class="on">트레이너</a><a>대회</a><a>포켓몬</a><a>랭킹</a></div>
  <div class="search">${ic('search', 20)}트레이너 검색</div>
  ${table(10)}
  ${tabs('rec')}
</div>`;

/* ====================================================== B. 황금 분할 ====================================================== */
/* the home cover: a 390 x 631 golden rectangle cut into squares 390, 241, 149, 92, 57 */
const coverPhone = (style = []) => {
  const st = i => style[i] || '';
  const W = 'rgba(255,255,255,.12)', Nv = 'rgba(8,28,61,.12)';
  return `<div class="abs" style="left:-1px;top:56px;width:392px;height:633px">
  <div style="${st(0)}">${T(0, 0, 392, 391, 'n', `
    <div class="abs" style="left:20px;top:20px;font-size:32px;line-height:1.18;font-weight:700;letter-spacing:-.02em">모든 승부가<br>기록이 됩니다.</div>
    <img class="sprite" src="${S('garchomp')}" style="right:4px;bottom:36px;width:236px;height:236px">
    <div class="abs" style="left:20px;bottom:20px"><div class="label on">현 챔피언, 6대</div><div style="font-size:20px;font-weight:700;margin-top:4px">김현민</div></div>
    <span class="abs" style="right:20px;bottom:20px;color:var(--on-2)">${ic('arrow', 20)}</span>`, arc(390, 390, 'br', W))}</div>
  <div style="${st(1)}">${T(0, 390, 242, 243, 'p', `
    <div class="abs" style="left:20px;top:20px;right:20px;display:flex;justify-content:space-between"><span class="label">다음 대회</span><span class="label">11월 7일 (토)</span></div>
    <div class="num abs" style="left:18px;top:44px;font-size:68px;line-height:1">D-5</div>
    <div class="abs" style="left:20px;top:122px;width:200px;font-size:14px;font-weight:600;line-height:1.4">37회 파이컵 마스터 리그<br>NPC 배틀 7</div>
    <a class="btn abs" style="left:20px;right:20px;bottom:20px;justify-content:space-between;height:40px;font-size:14px;padding:0 12px 0 16px">이번 대회 신청 ${ic('arrow', 18, 2)}</a>`, arc(241, 241, 'tr', Nv))}</div>
  <div style="${st(2)}">${T(241, 482, 150, 151, 'n', `
    <div class="abs" style="left:16px;bottom:16px"><div class="num" style="font-size:44px;line-height:1">59</div><div class="label on" style="margin-top:6px">지금까지의 대회</div></div>`, arc(149, 149, 'tl', W))}</div>
  <div style="${st(3)}">${T(298, 390, 93, 93, 'p', `
    <div class="abs" style="left:12px;bottom:10px"><div class="num" style="font-size:28px;line-height:1">71</div><div class="label" style="margin-top:4px;font-size:11px">트레이너</div></div>`, arc(92, 92, 'bl', Nv))}</div>
  <div style="${st(4)}">${T(241, 390, 58, 93, 'n', `<svg class="abs" style="left:13px;top:36px;color:#fff" width="30" height="20"><use href="#wing"/></svg>`, '')}</div>
  </div>`;
};
const B1 = (style) => `<div class="ph B">
  <header class="bar" style="background:var(--navy);color:#fff">${brand(20)}<span class="icons">${ic('moon', 22)}</span></header>
  ${coverPhone(style)}
  <div class="abs" style="left:20px;right:20px;top:721px;display:flex;justify-content:space-between;align-items:baseline"><span style="font-size:20px;font-weight:700">공지</span><span class="link">전체 보기</span></div>
  ${tabs('home')}
</div>`;

const B2 = `<div class="ph B">
