<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>YPL scoreboard C3</title>
<style>
@font-face { font-family: "Albert Sans"; src: url("../../public/fonts/albert-sans-latin-wght.woff2") format("woff2"); font-weight: 100 900; unicode-range: U+0000-00FF, U+2000-206F, U+2190-2193; }
@font-face { font-family: "Freesentation"; src: url("../../public/fonts/freesentation/Freesentation-4Regular.woff2") format("woff2"); font-weight: 400; }
@font-face { font-family: "Freesentation"; src: url("../../public/fonts/freesentation/Freesentation-6SemiBold.woff2") format("woff2"); font-weight: 600; }
@font-face { font-family: "Freesentation"; src: url("../../public/fonts/freesentation/Freesentation-7Bold.woff2") format("woff2"); font-weight: 700; }
/* dark is the default board. Panels lift one step off the ground; light comes in three strengths. */
:root {
  --ground: #081C3D; --panel: #0E2449; --panel-2: #12294F; --rule: #1D365F;
  --lit: #FFFFFF; --dim: #A8B8D3; --mute: #8196B9; --signal: #FFB21A; --off: .08;
  --font: "Albert Sans", "Freesentation", sans-serif;
}
.light { --ground: #FFFFFF; --panel: #EEF1F6; --panel-2: #E6EAF1; --rule: #D9DEE7; --lit: #081C3D; --dim: #46536C; --mute: #5C6981; --signal: #B36F00; --off: .06; }
/* an inverted panel: the winner's row and the record holder */
.inv { background: var(--lit) !important; color: var(--ground) !important; --off: .10; }
.inv .seg { color: var(--ground); }
* { box-sizing: border-box; margin: 0; padding: 0; }
body { font-family: var(--font); background: #D5DAE3; -webkit-font-smoothing: antialiased; word-break: keep-all; }
.board { display: inline-block; padding: 84px; background: #E3E7EE; color: #081C3D; }
.board > h1 { font-size: 32px; font-weight: 700; letter-spacing: -.01em; }
.board > p.lede { margin-top: 12px; font-size: 16px; line-height: 1.6; color: #5B6880; max-width: 1180px; }
.row { display: flex; gap: 52px; margin-top: 52px; align-items: flex-start; }
.cap { margin-top: 20px; font-size: 13px; font-weight: 600; color: #5B6880; }
.ph { position: relative; width: 390px; height: 844px; overflow: hidden; background: var(--ground); color: var(--lit); }
.abs { position: absolute; }
/* type: four sizes only. 12 label, 15 reading, 20 title, 32 page */
.t12 { font-size: 12px; line-height: 16px; font-weight: 600; }
.t15 { font-size: 15px; line-height: 20px; font-weight: 600; }
.t20 { font-size: 20px; line-height: 28px; font-weight: 700; letter-spacing: -.01em; }
.t32 { font-size: 32px; line-height: 40px; font-weight: 700; letter-spacing: -.02em; }
.dim { color: var(--dim); } .mute { color: var(--mute); } .reg { font-weight: 400; }
.num { font-family: "Albert Sans"; font-variant-numeric: tabular-nums; }
.pn { background: var(--panel); } .pn2 { background: var(--panel-2); }
.seg { display: block; color: var(--lit); flex: none; }
.seg .off { opacity: var(--off); }
.lamp { display: inline-block; width: 8px; height: 8px; background: var(--lit); flex: none; }
.lamp.sig { background: var(--signal); }
.bar { position: relative; height: 56px; display: flex; align-items: center; justify-content: space-between; padding: 0 20px; box-shadow: inset 0 -1px 0 var(--rule); color: var(--lit); }
.brand { display: flex; align-items: center; gap: 8px; flex: none; color: var(--lit); }
.tabs { position: absolute; left: 0; right: 0; bottom: 0; height: 64px; display: grid; grid-template-columns: repeat(5, 1fr); background: var(--ground); box-shadow: inset 0 1px 0 var(--rule); z-index: 4; }
.tabs a { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--mute); position: relative; }
.tabs a.on { color: var(--lit); font-weight: 700; }
.tabs a.on::before { content: ""; position: absolute; top: 0; left: 50%; width: 32px; margin-left: -16px; height: 2px; background: var(--lit); }
.btn { display: flex; align-items: center; justify-content: space-between; height: 52px; padding: 0 20px; font-size: 15px; font-weight: 700; background: var(--lit); color: var(--ground); }
.link { font-size: 12px; line-height: 16px; font-weight: 600; color: var(--dim); text-decoration: underline; text-underline-offset: 4px; text-decoration-thickness: 1px; }
.sh { display: flex; justify-content: space-between; align-items: baseline; margin: 0 20px; }
.stack { display: grid; gap: 2px; margin: 0 20px; }
.sprite { position: absolute; object-fit: contain; }
.tabsline { display: flex; gap: 32px; margin: 0 20px; height: 44px; box-shadow: inset 0 -1px 0 var(--rule); }
.tabsline a { display: flex; align-items: center; font-size: 15px; font-weight: 600; color: var(--mute); }
.tabsline a.on { color: var(--lit); font-weight: 700; box-shadow: inset 0 -2px 0 var(--lit); }
.desk { position: relative; width: 1440px; height: 900px; overflow: hidden; background: var(--ground); color: var(--lit); }
/* storyboard */
.sb { display: flex; gap: 32px; margin-top: 32px; }
.sb .fr { width: 234px; }
.sb .mini { width: 234px; height: 506px; overflow: hidden; position: relative; }
.sb .mini > .ph { transform: scale(.6); transform-origin: 0 0; }
.sb .t { margin-top: 12px; font-size: 13px; font-weight: 700; } .sb .s { margin-top: 4px; font-size: 12px; line-height: 1.5; color: #5B6880; }
.sb-title { margin-top: 52px; font-size: 20px; font-weight: 700; }
/* the board switched off: only the unlit segments and the bars */
.s0 .pn, .s0 .pn2, .s1 .pn2 { background: transparent; }
.s0 .ct *, .s1 .ct * { color: transparent !important; }
.s0 .ct .seg, .s1 .ct .seg, .s0 .ct .seg *, .s1 .ct .seg * { color: var(--lit) !important; }
.s0 .ct .btn, .s1 .ct .btn { background: transparent; color: transparent; }
.s0 .ct .lamp, .s1 .ct .lamp { opacity: 0; }
.s0 .seg .on, .s1 .seg .on { opacity: var(--off); }
.s0 img, .s1 img, .s2 img { opacity: 0; }
.s2 .ct .reg, .s2 .ct .dim { color: transparent; }
/* redlines */
.rl { position: absolute; background: #FF3B6B; z-index: 9; }
.rl-l { position: absolute; z-index: 9; font: 700 11px/14px "Albert Sans"; color: #fff; background: #FF3B6B; padding: 0 4px; }
.spec { display: grid; grid-template-columns: 1fr 1fr; gap: 52px; }
.spec h3 { font-size: 15px; font-weight: 700; margin-bottom: 12px; }
.spec p { font-size: 13px; line-height: 1.6; color: #5B6880; }
.ladder { display: flex; align-items: flex-end; gap: 12px; margin: 12px 0 20px; }
.ladder > div > div { background: #081C3D; }
.ladder span { display: block; font: 600 11px "Albert Sans"; color: #5B6880; margin-top: 6px; text-align: center; }

/* a Pokémon always stands in a panel with its feet on a floor band of the next tone; it never floats and never gets a box of its own */
.pn2:has(> img.sprite) { background: var(--panel) !important; position: relative; overflow: hidden; }
.pn2:has(> img.sprite)::before { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 24%; background: var(--panel-2); }
.pn2:has(> img.sprite) > img.sprite { z-index: 1; object-position: 50% 100%; }
.pn2:has(> img.sprite) > :not(img) { z-index: 2; }
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="wing" viewBox="0 0 1315.1 870.6"><path fill="currentColor" d="M0 0 L427.7 118 L657.5 430 L887.4 118 L1315.1 0 L1199.8 164 L947.9 233.5 L755.3 495.5 L755.3 536.5 L559.8 536.5 L559.8 495.5 L367.1 233.5 L115.3 164 Z M246.8 351.1 L149.5 212.7 L403.3 282.8 L506.3 422.7 Z M808.8 422.7 L911.7 282.8 L1165.6 212.7 L1068.3 351.1 Z M559.8 574.5 L755.3 574.5 L755.3 608.1 L916.1 732.5 L805.8 811.8 L713.7 639.1 L692.3 639.1 L751.1 811.8 L657.5 870.6 L564 811.8 L622.8 639.1 L601.3 639.1 L509.3 811.8 L399 732.5 L559.8 608.1 Z"/></symbol>
  <symbol id="word" viewBox="0 0 310 100"><path fill="currentColor" fill-rule="evenodd" transform="skewX(-12) translate(21 0)" d="M0 0 H34.7 L55 27.7 L75.3 0 H110 L69 56 V100 H41 V56 Z M118 0 H188 A18 18 0 0 1 206 18 V46 A18 18 0 0 1 188 64 H146 V100 H118 Z M146 24 H178 V40 H146 Z M214 0 H242 V76 H286 V100 H214 Z"/></symbol>
</defs></svg>
<div id="root"></div>
<script>
const S = n => `../../public/sprites/pokemon/${n}.webp`;
const I = {
  home: '<path d="M4 10.5 12 4l8 6.5V20h-5.5v-6h-5v6H4z"/>',
  news: '<path d="M5.5 3.5h13v17h-13zM9 8.5h6M9 12h6M9 15.5h3.5"/>',
  bracket: '<path d="M3.5 6h5.5v12H3.5M9 12h5.5M14.5 8.5h6v7h-6z"/>',
  rec: '<path d="M4 12h4v8H4zM10 5h4v15h-4zM16 9h4v11h-4z"/>',
  more: '<path d="M4.5 10.5h3v3h-3zM10.5 10.5h3v3h-3zM16.5 10.5h3v3h-3z" fill="currentColor"/>',
  moon: '<path d="M19.5 14.5A8 8 0 1 1 9.5 4.5a6.5 6.5 0 0 0 10 10z"/>',
  sun: '<path d="M12 8a4 4 0 1 1 0 8 4 4 0 0 1 0-8zM12 2.5v2.5M12 19v2.5M2.5 12H5M19 12h2.5M5.3 5.3l1.8 1.8M16.9 16.9l1.8 1.8M5.3 18.7l1.8-1.8M16.9 7.1l1.8-1.8"/>',
  arrow: '<path d="M4.5 12h15M13.5 6l6 6-6 6"/>', search: '<path d="M10.5 4.5a6 6 0 1 1 0 12 6 6 0 0 1 0-12zM15 15l5 5"/>',
};
const ic = (n, s = 22, w = 1.5) => `<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${w}" stroke-linecap="square" stroke-linejoin="miter" style="display:block;flex:none">${I[n]}</svg>`;
const brand = (h = 20) => `<span class="brand"><svg width="${h * 1.51}" height="${h}"><use href="#wing"/></svg><svg width="${h * 2.6}" height="${h * .84}"><use href="#word"/></svg></span>`;
const bar = light => `<header class="bar">${brand(20)}${ic(light ? 'moon' : 'sun', 22)}</header>`;
const tabs = on => `<nav class="tabs">${[['home','홈'],['news','공지'],['bracket','대진표'],['rec','기록'],['more','더보기']].map(([k, l]) => `<a class="${k === on ? 'on' : ''}">${ic(k)}<span>${l}</span></a>`).join('')}</nav>`;

/* ---------- a seven segment display. Every digit cell holds all seven bars; the unlit ones stay faintly visible, as on a real board.
   A cell is h tall and h / phi wide. A display has a fixed number of cells: a smaller number leaves the leading cells dark. ---------- */
const SEG = { 0: 'abcdef', 1: 'bc', 2: 'abged', 3: 'abgcd', 4: 'fgbc', 5: 'afgcd', 6: 'afgedc', 7: 'abc', 8: 'abcdefg', 9: 'abcdfg', '-': 'g', ' ': '' };
function seg(v, h, n) {
  const str = String(v).padStart(n || String(v).length, ' ');
  /* each bar is a hexagon on a centre line, mitred at 45 degrees like a real display; bars stop short of each other by a hair */
  const w = Math.round(h / 1.618), t = Math.max(3, Math.round(w * .16)), r = t / 2, gap = Math.max(1, t * .18), sp = Math.round(w * .32);
  const x0 = r, x1 = w - r, y0 = r, ym = h / 2, y1 = h - r;
  const H = (xa, xb, y) => [[xa + gap, y], [xa + gap + r, y - r], [xb - gap - r, y - r], [xb - gap, y], [xb - gap - r, y + r], [xa + gap + r, y + r]];
  const V = (x, ya, yb) => [[x, ya + gap], [x + r, ya + gap + r], [x + r, yb - gap - r], [x, yb - gap], [x - r, yb - gap - r], [x - r, ya + gap + r]];
  const B = { a: H(x0, x1, y0), g: H(x0, x1, ym), d: H(x0, x1, y1), f: V(x0, y0, ym), b: V(x1, y0, ym), e: V(x0, ym, y1), c: V(x1, ym, y1) };
  const W = str.length * w + (str.length - 1) * sp;
  let off = '', on = '';
  [...str].forEach((c, i) => { const dx = i * (w + sp); for (const k of 'abcdefg') { const poly = `<polygon points="${B[k].map(([x, y]) => `${(x + dx).toFixed(1)},${y.toFixed(1)}`).join(' ')}"/>`; SEG[c].includes(k) ? (on += poly) : (off += poly); } });
  return `<svg class="seg" width="${W}" height="${h}" viewBox="0 0 ${W} ${h}" fill="currentColor"><g class="off">${off}</g><g class="on">${on}</g></svg>`;
}

/* ================================ home, first screen ================================
   rhythm: bar 56, 32, label 16, 12, display 120, 20, title 56, 20, action 52, 52, champion 216, 2, counters 84 = 738 */
const home = (light, stage = '') => `<div class="ph ${light ? 'light' : ''} ${stage}">
  ${bar(light)}
  <div class="ct">
  <div class="abs t12 dim" style="left:20px;right:20px;top:88px;display:flex;justify-content:space-between;align-items:center"><span style="display:flex;align-items:center;gap:8px"><span class="lamp"></span>다음 대회까지</span><span class="num">11.07 <span style="font-family:Freesentation">토</span></span></div>
  <div class="abs" style="left:20px;top:116px;display:flex;align-items:flex-end;gap:12px">${seg('05', 120, 2)}<span class="t20" style="line-height:20px">일</span></div>
  <div class="abs t20" style="left:20px;top:256px">37회 파이컵 마스터 리그<br>NPC 배틀 7</div>
  <a class="btn abs" style="left:20px;right:20px;top:332px">이번 대회 신청 ${ic('arrow', 20, 2)}</a>
  <div class="abs" style="left:20px;top:436px;width:350px"><div class="pn" style="position:relative;overflow:hidden;height:216px"><div style="position:absolute;left:0;right:0;bottom:0;height:52px;background:var(--panel-2)"></div><div class="abs" style="left:12px;top:12px"><div class="t12 dim">현 챔피언</div><div class="t20" style="margin-top:8px">김현민</div><div class="t12 dim reg" style="margin-top:4px">6대, YPL 시즌 2 우승</div></div><span class="abs t12" style="left:12px;bottom:18px;display:flex;align-items:center;gap:4px">파티 보기 ${ic('arrow', 16, 1.5)}</span><img class="sprite" src="${S('garchomp')}" style="right:12px;bottom:20px;width:184px;height:184px;object-position:50% 100%"></div></div>
  <div class="abs" style="left:20px;top:654px;width:350px;display:grid;grid-template-columns:115px 116px 115px;gap:2px">
    ${[['59','대회'],['71','트레이너'],['3','시즌']].map(([n, l]) => `<div class="pn" style="height:84px;padding:12px;display:flex;flex-direction:column;justify-content:space-between"><span class="t12 dim">${l}</span>${seg(n, 40, 2)}</div>`).join('')}
  </div>
  </div>
  ${tabs('home')}
</div>`;

/* ================================ home, lower ================================ */
const notices = [['10.28','수','제38회 파이컵 공지', true],['10.01','목','37회 파이컵 팀전 팀 편성 안내'],['09.19','토','37회 파이컵 팀전 리전 워즈']];
const homeLow = `<div class="ph">
  ${bar()}
  <div class="sh" style="margin-top:32px"><span class="t20">YPL 시즌 3 순위</span><span class="link">전체 보기</span></div>
  <div class="stack" style="margin-top:12px">
    ${['이상준','이준혁','양승규'].map(n => `<div class="pn" style="height:52px;display:grid;grid-template-columns:52px 1fr auto;align-items:center;padding-right:12px"><span class="num t20" style="text-align:center">1</span><span class="t15" style="font-weight:700">${n}</span><span style="display:flex;align-items:baseline;gap:4px"><span class="num t20">30</span><span class="t12 dim">점</span></span></div>`).join('')}
  </div>
  <div class="t12 mute reg" style="margin:8px 20px 0">세 명이 공동 1위입니다.</div>
  <div class="sh" style="margin-top:52px"><span class="t20">공지</span><span class="link">전체 보기</span></div>
  <div class="stack" style="margin-top:12px">
    ${notices.map(([d, w, t, isNew]) => `<div class="pn" style="height:52px;display:grid;grid-template-columns:84px 1fr 32px;align-items:center"><span class="num t15" style="padding-left:12px">${d}<span class="t12 dim" style="margin-left:4px;font-family:Freesentation">${w}</span></span><span class="t15" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${t}</span><span style="display:flex;justify-content:center">${isNew ? '<span class="lamp"></span>' : ''}</span></div>`).join('')}
  </div>
  <div class="sh" style="margin-top:52px"><span class="t20">역대 챔피언</span><span class="link">명예의 전당</span></div>
  <div style="display:flex;gap:2px;margin:12px 0 0 20px">
    ${[['정두호','5','lickilicky','YPL 시즌 1'],['이제빈','4','abomasnow-mega','클래식 시즌 4'],['허진욱','3','kingambit','클래식 시즌 3']].map(([n, g, s, l]) => `<div class="pn" style="flex:none;width:132px;height:204px;position:relative;overflow:hidden"><span class="abs" style="left:12px;top:10px"><span class="num t20">${g}</span><span class="t12 dim" style="margin-left:2px">대</span></span><img class="sprite" src="${S(s)}" style="left:14px;bottom:64px;width:104px;height:104px;object-position:50% 100%"><div style="position:absolute;left:0;right:0;bottom:0;height:64px;padding:12px;background:var(--panel-2)"><div class="t15" style="font-weight:700">${n}</div><div class="t12 dim reg" style="margin-top:4px">${l}</div></div></div>`).join('')}
  </div>
  ${tabs('home')}
</div>`;

/* ================================ bracket on the day ================================ */
const match = (no, a, b, sa, sb, state) => {
  const win = state === 'done' ? (sa > sb ? 0 : 1) : -1;
  const line = ([name, seed], sc, i) => {
    const w = win === i, l = win !== -1 && !w;
    return `<div class="${w ? 'inv' : ''}" style="height:52px;display:grid;grid-template-columns:40px 1fr 52px;align-items:center">
      <span class="num t12 ${w ? '' : 'mute'}" style="padding-left:12px">${seed}</span>
      <span class="t15 ${l ? 'mute' : ''}" style="font-weight:700">${name}</span>
      <span style="display:flex;justify-content:flex-end;padding-right:12px;${l ? 'opacity:.45' : ''}">${seg(sc === null ? ' ' : sc, 32, 1)}</span></div>`;
  };
  return `<div class="pn">
    <div class="t12" style="height:32px;display:flex;justify-content:space-between;align-items:center;padding:0 12px;box-shadow:inset 0 -1px 0 var(--rule)"><span class="num dim">M${no}</span><span style="display:flex;align-items:center;gap:8px;${state === 'live' ? '' : 'color:var(--mute)'}">${state === 'live' ? '<span class="lamp sig"></span>진행 중' : state === 'done' ? '종료' : '대기'}</span></div>
    ${line(a, sa, 0)}<div style="height:1px;background:var(--rule)"></div>${line(b, sb, 1)}
  </div>`;
};
const bracket = (scores = [1, 1], state3 = 'live') => `<div class="ph">
  ${bar()}
  <div class="t12" style="height:32px;display:flex;align-items:center;gap:8px;padding:0 20px;background:var(--panel)"><span class="lamp sig"></span><span>오늘 대회 진행 중</span><span class="dim num" style="margin-left:auto">8강 2/4 종료</span></div>
  <div class="t12 dim" style="margin:32px 20px 0">대진표</div>
  <div class="t20" style="margin:8px 20px 0">37회 파이컵 마스터 리그<br>NPC 배틀 7</div>
  <div class="tabsline" style="margin-top:20px"><a class="on">8강</a><a>4강</a><a>결승</a><span class="t12 mute" style="margin-left:auto;align-self:center">예시 데이터</span></div>
  <div class="stack" style="margin-top:20px">
    ${match(3, ['김현민', 2], ['이준영', 7], scores[0], scores[1], state3)}
    ${match(4, ['이병재', 3], ['이제빈', 6], null, null, 'wait')}
    ${match(1, ['정두호', 1], ['김다온', 8], 2, 0, 'done')}
    ${match(2, ['이종우', 4], ['김원의', 5], 1, 2, 'done')}
  </div>
  ${tabs('bracket')}
</div>`;

/* ================================ records ================================ */
const records = [['정두호',8,6,8],['이종우',5,2,7],['김현민',4,3,2],['이병재',3,1,5],['허진욱',3,0,5],['이준영',2,3,7],['김원의',2,3,6],['이제빈',2,2,9]];
const cols = 'grid-template-columns:40px 1fr 52px 52px 52px';
const recs = `<div class="ph">
  ${bar()}
  <div class="sh" style="margin-top:32px;align-items:flex-end"><span class="t32">기록</span><span class="t12 dim" style="padding-bottom:6px">2023년 5월부터</span></div>
  <div class="stack" style="margin-top:20px;grid-template-columns:115px 116px 115px">
    ${[['71','트레이너'],['59','대회'],['6','챔피언']].map(([n, l]) => `<div class="pn" style="height:84px;padding:12px;display:flex;flex-direction:column;justify-content:space-between"><span class="t12 dim">${l}</span>${seg(n, 40, 2)}</div>`).join('')}
  </div>
