<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>YPL scoreboard C4</title>
<link rel="stylesheet" href="c-core.css">
<style>
/* reading text and the parts the remaining screens add: fields, choices, sticky actions, the admin dock */
.p15 { font-size: 15px; line-height: 24px; font-weight: 400; }
.clamp2 { display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.ell { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back { display: flex; align-items: center; gap: 4px; margin: 20px 20px 0; }
.fl { margin: 0 20px; }
.fl > .t12 { display: block; margin-bottom: 8px; }
.in { height: 52px; display: flex; align-items: center; gap: 12px; padding: 0 12px; background: var(--panel); font-size: 15px; line-height: 20px; }
.in.focus { box-shadow: inset 0 -2px 0 var(--lit); }
.in .ph-t { color: var(--mute); }
.choice { display: grid; gap: 2px; }
.choice > span { height: 44px; display: flex; align-items: center; justify-content: center; background: var(--panel); font-size: 15px; font-weight: 600; color: var(--dim); }
.choice > span.on { background: var(--lit); color: var(--ground); font-weight: 700; }
.chips { display: flex; gap: 2px; margin: 0 20px; overflow: hidden; }
.chips > span { flex: none; height: 32px; display: flex; align-items: center; padding: 0 12px; background: var(--panel); font-size: 12px; font-weight: 600; color: var(--dim); }
.chips > span.on { background: var(--lit); color: var(--ground); }
.btn2 { display: flex; align-items: center; justify-content: center; gap: 8px; height: 52px; background: var(--panel); font-size: 15px; font-weight: 700; color: var(--lit); }
.dock { position: absolute; left: 0; right: 0; bottom: 64px; padding: 16px 20px; background: var(--ground); box-shadow: inset 0 1px 0 var(--rule); z-index: 3; }
.admin { position: absolute; left: 0; right: 0; bottom: 64px; height: 40px; display: flex; align-items: center; gap: 8px; padding: 0 20px; background: var(--lit); color: var(--ground); font-size: 12px; font-weight: 700; z-index: 5; }
.admin .lamp { background: var(--ground); }
.box { width: 20px; height: 20px; flex: none; background: var(--panel-2); display: grid; place-items: center; }
.box.on { background: var(--lit); color: var(--ground); }
.sw { width: 52px; height: 32px; padding: 4px; background: var(--panel-2); display: flex; flex: none; }
.sw i { width: 24px; height: 24px; background: var(--mute); }
.sw.on { justify-content: flex-end; background: var(--lit); } .sw.on i { background: var(--ground); }
.ty { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; line-height: 16px; font-weight: 600; color: var(--dim); }
.ty i { width: 3px; height: 12px; display: block; }
.toast { position: absolute; left: 20px; right: 20px; height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 16px; background: var(--lit); color: var(--ground); font-size: 15px; font-weight: 600; z-index: 6; }
.track { position: relative; height: 8px; background: var(--panel-2); }
.track b { position: absolute; top: 0; bottom: 0; left: 0; background: var(--lit); }
.ld .ct * { color: transparent !important; }
.ld .ct .seg, .ld .ct .seg * { color: var(--lit) !important; }
.ld .seg .on { opacity: var(--off); }
.ld img, .ld .ct .lamp { opacity: 0; }
.ld .ct .btn { background: var(--panel); }
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="wing" viewBox="0 0 1315.1 870.6"><path fill="currentColor" d="M0 0 L427.7 118 L657.5 430 L887.4 118 L1315.1 0 L1199.8 164 L947.9 233.5 L755.3 495.5 L755.3 536.5 L559.8 536.5 L559.8 495.5 L367.1 233.5 L115.3 164 Z M246.8 351.1 L149.5 212.7 L403.3 282.8 L506.3 422.7 Z M808.8 422.7 L911.7 282.8 L1165.6 212.7 L1068.3 351.1 Z M559.8 574.5 L755.3 574.5 L755.3 608.1 L916.1 732.5 L805.8 811.8 L713.7 639.1 L692.3 639.1 L751.1 811.8 L657.5 870.6 L564 811.8 L622.8 639.1 L601.3 639.1 L509.3 811.8 L399 732.5 L559.8 608.1 Z"/></symbol>
  <symbol id="word" viewBox="0 0 310 100"><path fill="currentColor" fill-rule="evenodd" transform="skewX(-12) translate(21 0)" d="M0 0 H34.7 L55 27.7 L75.3 0 H110 L69 56 V100 H41 V56 Z M118 0 H188 A18 18 0 0 1 206 18 V46 A18 18 0 0 1 188 64 H146 V100 H118 Z M146 24 H178 V40 H146 Z M214 0 H242 V76 H286 V100 H214 Z"/></symbol>
</defs></svg>
<div id="root"></div>
<script src="c-core.js"></script>
<script>
Object.assign(I, {
  back: '<path d="M14.5 6l-6 6 6 6"/>', chev: '<path d="M9.5 6l6 6-6 6"/>', down: '<path d="M6 9.5l6 6 6-6"/>',
  plus: '<path d="M12 5v14M5 12h14"/>', minus: '<path d="M5 12h14"/>', check: '<path d="M5 12.5l4.5 4.5L19 7.5"/>', close: '<path d="M6.5 6.5l11 11M17.5 6.5l-11 11"/>',
  bell: '<path d="M6.5 16.5V11a5.5 5.5 0 0 1 11 0v5.5zM4.5 16.5h15M10 19.5h4"/>', download: '<path d="M12 4.5v10M7.5 10l4.5 4.5 4.5-4.5M5 19.5h14"/>',
  image: '<path d="M4 5h16v14H4zM4 15.5l4.5-4.5 4 4 2.5-2.5 5 5"/>',
});
const TYPE = { 에스퍼: '#F95587', 페어리: '#D685AD', 땅: '#E2BF65', 강철: '#B7B7CE', 드래곤: '#6F35FC', 비행: '#A98FF3', 악: '#8A6F5C', 고스트: '#735797', 물: '#6390F0', 불꽃: '#EE8130', 풀: '#7AC74C', 격투: '#C22E28', 노말: '#A8A77A' };
const ty = list => list.map(t => `<span class="ty"><i style="background:${TYPE[t]}"></i>${t}</span>`).join('<span style="width:8px;display:inline-block"></span>');

/* ---------- shared screen parts ---------- */
const page = (body, tab, { admin = false, dock = '', toast = '' } = {}) => `<div class="ph">${bar()}<div class="ct">${body}</div>${toast}${dock ? `<div class="dock" style="${admin ? 'bottom:104px' : ''}">${dock}</div>` : ''}${admin ? `<div class="admin"><span class="lamp"></span>관리자 모드<span style="margin-left:auto;font-weight:600">로그아웃</span></div>` : ''}${tabs(tab)}</div>`;
const head = (title, right = '') => `<div class="sh" style="margin-top:32px;align-items:flex-end"><span class="t32">${title}</span>${right}</div>`;
const sec = (title, link = '', top = 52) => `<div class="sh" style="margin-top:${top}px"><span class="t20">${title}</span>${link ? `<span class="link">${link}</span>` : ''}</div>`;
const back = to => `<a class="back t12 dim">${ic('back', 16)}${to}</a>`;
const field = (label, value, { ph = false, focus = false, right = '', top = 20 } = {}) => `<div class="fl" style="margin-top:${top}px">${label ? `<span class="t12 dim">${label}</span>` : ''}<div class="in ${focus ? 'focus' : ''}"><span class="${ph ? 'ph-t' : ''}" style="flex:1">${value}</span>${right}</div></div>`;
const search = (ph, right = '') => `<div class="fl" style="margin-top:20px;display:flex;gap:2px"><div class="in" style="flex:1;color:var(--mute)">${ic('search', 20)}<span>${ph}</span></div>${right}</div>`;
const tabsline = (items, on = 0, top = 32) => `<div class="tabsline" style="margin-top:${top}px">${items.map((t, i) => `<a class="${i === on ? 'on' : ''}">${t}</a>`).join('')}</div>`;
const counters = (list, cells = 2) => `<div class="stack" style="margin-top:20px;grid-template-columns:115px 116px 115px">${list.map(([n, l, extra = '']) => `<div class="pn" style="height:84px;padding:12px;display:flex;flex-direction:column;justify-content:space-between"><span class="t12 dim">${l}</span><span style="display:flex;align-items:flex-end;gap:6px">${seg(n, 40, cells)}${extra}</span></div>`).join('')}</div>`;
const example = `<span class="t12 mute">예시 데이터</span>`;

/* ================================ notices ================================ */
const notices = [
  ['제38회 파이컵 공지', '10.28', '수', '고정', true], ['37회 파이컵 팀전 팀 편성 안내', '10.01', '목'], ['37회 파이컵 팀전 리전 워즈', '09.19', '토'],
  ['배틀부 세미나 미니대회 1조', '09.19', '토'], ['배틀부 세미나 미니대회 2조', '09.19', '토'], ['7회 파이컵 라이트 공지', '09.09', '수'], ['YPL 시즌3 운영위원 모집', '08.01', '토'],
];
const noticeRow = ([t, d, w, pin, isNew]) => `<div class="pn" style="height:64px;display:grid;grid-template-columns:1fr 32px;align-items:center;padding-left:12px">
  <div style="min-width:0"><div class="t15 ell" style="font-weight:700">${t}</div><div class="t12 dim reg" style="margin-top:4px"><span class="num">${d}</span> ${w}${pin ? '<span style="color:var(--lit);font-weight:600;margin-left:8px">고정</span>' : ''}</div></div>
  <span style="display:flex;justify-content:center">${isNew ? '<span class="lamp"></span>' : ''}</span></div>`;
const N1 = page(`
  ${head('공지', `<span class="t12" style="display:flex;align-items:center;gap:6px;padding-bottom:6px">${ic('bell', 16)}알림 받기</span>`)}
  ${search('공지 제목과 내용 검색')}
  <div class="stack" style="margin-top:20px">${notices.map(noticeRow).join('')}</div>
  <div class="fl" style="margin-top:20px;display:grid;grid-template-columns:52px 1fr 52px;gap:2px"><span class="btn2">${ic('back', 20)}</span><span class="btn2 num">1 <span class="dim" style="font-weight:600;margin:0 6px">/</span> 2</span><span class="btn2">${ic('chev', 20)}</span></div>`, 'news');

const N2 = page(`
  ${back('공지')}
  <div class="t12 dim reg" style="margin:12px 20px 0">고정, <span class="num">10</span>월 <span class="num">28</span>일 (수)</div>
  <div class="t32" style="margin:8px 20px 0">제38회 파이컵 공지</div>
  <div class="stack" style="margin-top:20px;grid-template-columns:174px 174px">
    <div class="pn" style="height:84px;padding:12px;display:flex;flex-direction:column;justify-content:space-between"><span class="t12 dim" style="display:flex;align-items:center;gap:8px"><span class="lamp"></span>대회까지</span><span style="display:flex;align-items:flex-end;gap:6px">${seg('05', 40, 2)}<span class="t15">일</span></span></div>
    <div class="pn" style="height:84px;padding:12px;display:flex;flex-direction:column;justify-content:space-between"><span class="t12 dim">신청</span><span style="display:flex;align-items:flex-end;gap:6px">${seg(23, 40, 2)}<span class="t15 dim num">/ 32</span></span></div>
  </div>
  <div class="stack" style="margin-top:2px">${[['일시', '11월 7일 (토) 13:00'], ['형식', '싱글 배틀, NPC 파티'], ['방식', '싱글 엘리미네이션'], ['단위', '개인전']].map(([k, v]) => `<div class="pn" style="height:44px;display:grid;grid-template-columns:72px 1fr;align-items:center;padding-left:12px"><span class="t12 dim">${k}</span><span class="t15">${v}</span></div>`).join('')}</div>
  <p class="p15" style="margin:32px 20px 0">좋아하는 포켓몬 NPC의 파티로 승부하는 NPC 배틀 7이 열립니다. 신청은 아래 버튼으로 받고, 결과와 안내는 공지로 알려 드립니다.</p>`, 'news',
  { dock: `<a class="btn">참가 신청 ${ic('arrow', 20, 2)}</a>` });

const N3 = page(`
  ${back('제38회 파이컵 공지')}
  <div class="t20" style="margin:12px 20px 0">참가 신청</div>
  <div class="t12 dim reg" style="margin:4px 20px 0">* 표시는 필수입니다.</div>
  ${field('참가자 이름 *', '김현민')}
  ${field('디스코드 닉네임 *', 'hyunmin<span style="display:inline-block;width:1.5px;height:18px;background:var(--lit);vertical-align:-3px;margin-left:1px"></span>', { focus: true })}
  <div class="fl" style="margin-top:20px"><span class="t12 dim">쓰고 싶은 NPC 파티 *</span><div class="choice" style="grid-template-columns:1fr 1fr 1fr"><span>체육관 관장</span><span class="on">사천왕</span><span>챔피언</span></div></div>
  <div class="fl" style="margin-top:20px;display:flex;gap:12px;align-items:flex-start"><span class="box on">${ic('check', 16, 2)}</span><span class="t15 reg">공식 파티는 대회 전날까지 제출합니다.</span></div>`, 'news',
  { dock: `<a class="btn">신청하기 ${ic('arrow', 20, 2)}</a><div class="t12 dim reg" style="margin-top:8px;text-align:center">결과와 안내는 공지로 알려 드립니다.</div>` });

/* ================================ board ================================ */
const posts = [['선착순 1명 싸이버거', '맘스터치', '10.12', '월', 0], ['보노보니의 환경 주요 메가 티어리스트와 고찰', '트레이너', '08.18', '화', 1], ['M-4 31위 멸노 메팬 사이클', '트레이너', '08.17', '월', 1], ['M-4 최종 47위 마스카나 전개 카이류 핫삼', '트레이너', '08.16', '일', 1], ['m-4 8위 영원 망나핫삼', '트레이너', '08.15', '토', 1], ['하마돈 불매운동', '그라이온', '08.10', '월', 1]];
const G1 = page(`
  ${head('게시판')}
  ${tabsline(['자유', '샘플', '파티'], 0, 20)}
  ${search('제목, 내용, 글쓴이', `<a class="btn" style="width:96px;justify-content:center;gap:6px;padding:0">${ic('plus', 18, 2)}글쓰기</a>`)}
  <div class="stack" style="margin-top:20px">${posts.map(([t, a, d, w, c]) => `<div class="pn" style="height:64px;display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:0 12px"><div style="min-width:0"><div class="t15 ell" style="font-weight:700">${t}</div><div class="t12 dim reg" style="margin-top:4px">${a}<span class="num" style="margin-left:8px">${d}</span> ${w}</div></div><span class="t12 dim">${c ? `댓글 <span class="num">${c}</span>` : ''}</span></div>`).join('')}</div>`, 'more');

const party = [['garchomp', '한카리아스', '기합의띠'], ['dragonite-mega', '망나뇽', '망나뇽나이트'], ['hydreigon', '삼삼드래', '구애스카프'], ['aegislash', '킬가르도', '먹다남은음식'], ['metagross-mega', '메타그로스', '메타그로스나이트'], ['primarina', '누리레느', '물의주얼']];
const G2 = page(`
  ${back('게시판')}
  <div class="t12 dim reg" style="margin:12px 20px 0">파티, 트레이너, <span class="num">8</span>월 <span class="num">17</span>일 (월)</div>
  <div class="t20" style="margin:8px 20px 0">M-4 31위 멸노 메팬 사이클</div>
  <div class="stack" style="margin-top:20px;grid-template-columns:115px 116px 115px">${party.map(([s, n, it]) => `<div class="pn"><div class="pn2" style="height:96px;position:relative"><img class="sprite" src="${S(s)}" style="inset:12px;width:calc(100% - 24px);height:72px"></div><div style="padding:8px 12px 12px"><div class="t12" style="font-weight:700">${n}</div><div class="t12 dim reg ell">${it}</div></div></div>`).join('')}</div>
  <div class="stack" style="margin-top:2px;grid-template-columns:1fr 1fr"><a class="btn2" style="font-size:12px">팀 빌더에서 열기</a><a class="btn2" style="font-size:12px">${ic('image', 16)}이미지 저장</a></div>
  ${sec('댓글 <span class="num dim" style="font-weight:600">2</span>', '', 32)}
  <div class="stack" style="margin-top:12px">${[['보노보니', '10분 전', '메팬 사이클 깔끔하네요. 킬가르도 배분 궁금합니다.'], ['트레이너', '방금', 'H 252, A 4에 나머지 S입니다.']].map(([n, t, b]) => `<div class="pn" style="padding:12px"><div class="t12"><b>${n}</b><span class="dim reg" style="margin-left:8px">${t}</span></div><div class="t15 reg" style="margin-top:4px">${b}</div></div>`).join('')}</div>`, 'more',
  { dock: `<div style="display:flex;gap:2px"><div class="in" style="flex:1"><span class="ph-t">댓글 남기기</span></div><a class="btn" style="width:72px;justify-content:center;padding:0">등록</a></div>` });

const G3 = page(`
  ${back('게시판')}
  <div class="t20" style="margin:12px 20px 0">글쓰기</div>
  <div class="fl" style="margin-top:20px"><span class="t12 dim">게시판</span><div class="choice" style="grid-template-columns:1fr 1fr 1fr"><span>자유</span><span>샘플</span><span class="on">파티</span></div></div>
  ${field('제목', 'M-4 31위 멸노 메팬 사이클')}
  <div class="fl" style="margin-top:20px"><span class="t12 dim">올릴 팀</span><div class="pn" style="height:52px;display:grid;grid-template-columns:repeat(6,1fr) 52px;align-items:center;padding-left:6px">${party.map(([s]) => `<span class="pn2" style="position:relative;height:40px"><img class="sprite" src="${S(s)}" style="inset:0;width:100%;height:40px"></span>`).join('')}<span style="display:flex;justify-content:center;color:var(--dim)">${ic('chev', 20)}</span></div><div class="t12 dim reg" style="margin-top:8px">특성, 도구, 성격, 능력 포인트, 기술이 함께 올라갑니다.</div></div>
  <div class="fl" style="margin-top:20px;display:grid;grid-template-columns:1fr 1fr;gap:2px"><div><span class="t12 dim" style="display:block;margin-bottom:8px">닉네임</span><div class="in">트레이너</div></div><div><span class="t12 dim" style="display:block;margin-bottom:8px">비밀번호</span><div class="in" style="letter-spacing:4px">••••</div></div></div>
  <div class="fl" style="margin-top:20px;display:flex;gap:12px;align-items:center"><span class="box"></span><span class="t15 reg">관리자에게만 보이기 (건의, 비공개)</span></div>`, 'more',
  { dock: `<a class="btn">올리기 ${ic('arrow', 20, 2)}</a>` });

/* ================================ titles, hall of fame, about ================================ */
const champs = [['6', '김현민', 'YPL 시즌 2 우승', true], ['5', '정두호', 'YPL 시즌 1 우승'], ['4', '이제빈', '클래식 시즌 4 우승'], ['3', '허진욱', '클래식 시즌 3 우승'], ['2', '이종우', '클래식 시즌 2 우승'], ['1', '정두호', '클래식 시즌 1 우승']];
const T1 = page(`
  ${head('칭호', '<span class="t12 dim" style="padding-bottom:6px">6개 중 6개에 주인</span>')}
  <div class="tabsline" style="margin-top:20px;overflow:hidden">${['역대 챔피언', '타입 엑스퍼트', '지방 엘리트', '파트너'].map((t, i) => `<a class="${i ? '' : 'on'}" style="flex:none">${t}</a>`).join('')}</div>
  <div class="t12 dim reg" style="margin:20px 20px 0">챔피언스 시리즈 우승자에게 주는 칭호입니다.</div>
  <div class="stack" style="margin-top:12px">${champs.map(([g, n, l, cur]) => `<div class="${cur ? 'inv' : 'pn'}" style="height:64px;display:grid;grid-template-columns:64px 1fr auto;align-items:center;padding-right:12px"><span style="display:flex;align-items:baseline;justify-content:center;gap:2px"><span class="num t20">${g}</span><span class="t12">대</span></span><div><div class="t15" style="font-weight:700">${n}</div><div class="t12 reg ${cur ? '' : 'dim'}" style="margin-top:4px">${l}</div></div>${cur ? '<span class="t12">현 챔피언</span>' : ''}</div>`).join('')}</div>`, 'more');

const pastParties = { '정두호': ['lickilicky', 'kingambit', 'incineroar', 'rillaboom', 'sneasler', 'whimsicott'], '이제빈': ['abomasnow-mega', 'tinkaton', 'amoonguss', 'gyarados', 'milotic', 'lucario'] };
const H1 = page(`
  ${head('명예의 전당')}
