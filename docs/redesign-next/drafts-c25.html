<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>YPL scoreboard C25, the league in numbers on 소개</title>
<link rel="stylesheet" href="c-core.css">
<style>
/* C25 (2026-11-03): the top of 소개 says how old and how big the league is before it explains it. The figures are the home's facts
   (homeFacts.js loadFacts: first, tournaments, trainers), so nothing new is counted. Parts are the board's: 84 counters, the 40
   display, a unit lit with its digits, the 2px seam. */
.flow { padding: 0 20px; }
.grid { display: grid; gap: 2px; }
.ctr { height: 84px; padding: 12px; display: flex; flex-direction: column; justify-content: space-between; }
.ctr .bd { display: flex; align-items: flex-end; gap: 4px; }
.ctr .u { font-size: 15px; line-height: 15px; font-weight: 700; }
.read { font-size: 15px; line-height: 1.618; color: var(--dim); font-weight: 400; }
.step { display: flex; align-items: flex-start; padding: 12px 12px 12px 0; }
.step .n { width: 52px; text-align: center; flex: none; }
.hint { font-size: 13px; line-height: 1.55; color: #5B6880; max-width: 390px; margin-top: 12px; }
.hint b { color: #081C3D; }
.cols { display: flex; gap: 52px; align-items: flex-start; margin-top: 52px; }
.cols > div { flex: none; }
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="wing" viewBox="0 0 1315.1 870.6"><path fill="currentColor" d="M0 0 L427.7 118 L657.5 430 L887.4 118 L1315.1 0 L1199.8 164 L947.9 233.5 L755.3 495.5 L755.3 536.5 L559.8 536.5 L559.8 495.5 L367.1 233.5 L115.3 164 Z M246.8 351.1 L149.5 212.7 L403.3 282.8 L506.3 422.7 Z M808.8 422.7 L911.7 282.8 L1165.6 212.7 L1068.3 351.1 Z M559.8 574.5 L755.3 574.5 L755.3 608.1 L916.1 732.5 L805.8 811.8 L713.7 639.1 L692.3 639.1 L751.1 811.8 L657.5 870.6 L564 811.8 L622.8 639.1 L601.3 639.1 L509.3 811.8 L399 732.5 L559.8 608.1 Z"/></symbol>
  <symbol id="word" viewBox="0 0 310 100"><path fill="currentColor" fill-rule="evenodd" transform="skewX(-12) translate(21 0)" d="M0 0 H34.7 L55 27.7 L75.3 0 H110 L69 56 V100 H41 V56 Z M118 0 H188 A18 18 0 0 1 206 18 V46 A18 18 0 0 1 188 64 H146 V100 H118 Z M146 24 H178 V40 H146 Z M214 0 H242 V76 H286 V100 H214 Z"/></symbol>
</defs></svg>
<div id="root"></div>
<script src="c-core.js"></script>
<script>
/* ---------- data, as the site has it on 2026-11-03 (loadFacts) ---------- */
const FIRST = { year: '2023', month: '05' }, TOURNAMENTS = '59', TRAINERS = '71';
const LEDE = '연세대학교 포켓몬스터 동아리 포켓몬 센터 연세점, 줄여서 포센연에서 시작한 배틀 리그의 발자취입니다.';
const JOIN = [['디스코드 입장', '배틀과 중계는 디스코드에서 열립니다.'], ['공지에서 신청', '대회 공지의 신청 버튼으로 참가합니다.'], ['공식 파티 제출', '대회 시작 전까지 사이트에서 파티를 제출합니다.']];

const ctr = (label, board) => `<div class="pn ctr"><span class="t12 dim">${label}</span><span class="bd">${board}</span></div>`;
const unit = u => `<span class="u">${u}</span>`;
const join = () => `<div style="margin-top:52px;margin-bottom:12px"><span class="t20">참가하는 법</span></div>
  <div class="grid">${JOIN.map(([t, d], i) => `<div class="pn step"><span class="num t20 n">${i + 1}</span><span style="display:grid;gap:4px"><b class="t15">${t}</b><span class="t12 dim">${d}</span></span></div>`).join('')}</div>`;
const page = (top, light) => `<div class="ph${light ? ' light' : ''}">${bar(light)}<div class="flow">
  <div class="t32" style="margin-top:32px">소개</div>${top}${join()}</div>${tabs('more')}</div>`;

/* now: the title, a paragraph, then how to join */
const now = () => page(`<p class="read" style="margin-top:12px">${LEDE}</p>`);

/* A: the first event as a date on the board (two whole numbers, each with its unit), the two counts under it; the paragraph follows */
const draftA = light => page(`<div class="grid" style="margin-top:20px;grid-template-columns:1fr 1fr">
    <div style="grid-column:1 / -1">${ctr('첫 대회', `${seg(FIRST.year, 40, 4)}${unit('년')}<span style="width:8px"></span>${seg(FIRST.month, 40, 2)}${unit('월')}`)}</div>
    ${ctr('대회', seg(TOURNAMENTS, 40, 2))}${ctr('트레이너', seg(TRAINERS, 40, 2))}
  </div><p class="read" style="margin-top:20px">${LEDE}</p>`, light);

/* B: lighter; the first event is type on the title's line, the two counts stand under the paragraph */
const draftB = () => page(`<p class="read" style="margin-top:12px">${LEDE}</p>
  <div class="grid" style="margin-top:20px;grid-template-columns:1fr 1fr">${ctr('대회', seg(TOURNAMENTS, 40, 2))}${ctr('트레이너', seg(TRAINERS, 40, 2))}</div>
  <p class="t12 dim" style="margin-top:8px">2023년 5월 첫 대회부터 센 숫자입니다.</p>`);

const frame = (inner, cap, hint) => `<div><div>${inner}</div><div class="cap">${cap}</div>${hint ? `<p class="hint">${hint}</p>` : ''}</div>`;
document.getElementById('root').innerHTML = `<div class="board">
  <h1>C25 소개의 맨 위, 숫자로 보는 리그 (초안)</h1>
  <p class="lede">소개는 리그를 처음 보는 사람이 디스코드에서 넘어와 읽는 화면입니다. 설명 앞에 리그가 얼마나 오래, 얼마나 크게 이어졌는지를 판의 숫자로 먼저 보입니다. 숫자는 홈의 카운터와 같은 계산(loadFacts의 first, tournaments, trainers)이라 새로 세는 것이 없습니다. 부품은 84 카운터, 40 표시, 2px 이음매뿐입니다. 대회와 트레이너는 홈의 카운터처럼 단위 없이 이름표가 말하고, 날짜만 년과 월이 숫자와 함께 켜집니다.</p>
  <div class="cols">
    ${frame(now(), '지금: 제목과 한 문단')}
    ${frame(draftA(), '초안 A: 첫 대회를 판의 날짜로', '<b>첫 대회</b>는 넓은 판 하나에 2023년 05월을 두 개의 정수 표시로 켭니다(표시에는 정수만). 그 아래 <b>대회</b>와 <b>트레이너</b>가 반씩. 세 판이 제목 바로 아래 서고, 문단이 뒤따릅니다. 카운터는 홈처럼 기록 화면의 해당 탭으로 가는 문입니다.')}
    ${frame(draftA(true), '초안 A, 라이트')}
    ${frame(draftB(), '초안 B: 숫자 둘과 한 줄', '첫 대회는 숫자 판 아래의 회색 한 줄로 말하고, 판은 대회와 트레이너 둘만 섭니다. 더 조용하지만 리그의 나이가 판에 켜지지 않습니다.')}
  </div>
</div>`;
</script>
</body></html>
