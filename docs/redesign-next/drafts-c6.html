<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>YPL scoreboard C21</title>
<link rel="stylesheet" href="c-core.css">
<link rel="stylesheet" href="c-kit.css">
<style>
/* a Pokémon stands with its feet on a floor, inside a panel; it never floats on the ground */
.stand { position: relative; overflow: hidden; }
.stand img.sprite { left: 50%; transform: translateX(-50%); object-position: 50% 100%; }
.floor { position: absolute; left: 0; right: 0; bottom: 0; background: var(--panel-2); }
</style></head>
<body>
<svg width="0" height="0" style="position:absolute"><defs>
  <symbol id="wing" viewBox="0 0 1315.1 870.6"><path fill="currentColor" d="M0 0 L427.7 118 L657.5 430 L887.4 118 L1315.1 0 L1199.8 164 L947.9 233.5 L755.3 495.5 L755.3 536.5 L559.8 536.5 L559.8 495.5 L367.1 233.5 L115.3 164 Z M246.8 351.1 L149.5 212.7 L403.3 282.8 L506.3 422.7 Z M808.8 422.7 L911.7 282.8 L1165.6 212.7 L1068.3 351.1 Z M559.8 574.5 L755.3 574.5 L755.3 608.1 L916.1 732.5 L805.8 811.8 L713.7 639.1 L692.3 639.1 L751.1 811.8 L657.5 870.6 L564 811.8 L622.8 639.1 L601.3 639.1 L509.3 811.8 L399 732.5 L559.8 608.1 Z"/></symbol>
  <symbol id="word" viewBox="0 0 310 100"><path fill="currentColor" fill-rule="evenodd" transform="skewX(-12) translate(21 0)" d="M0 0 H34.7 L55 27.7 L75.3 0 H110 L69 56 V100 H41 V56 Z M118 0 H188 A18 18 0 0 1 206 18 V46 A18 18 0 0 1 188 64 H146 V100 H118 Z M146 24 H178 V40 H146 Z M214 0 H242 V76 H286 V100 H214 Z"/></symbol>
</defs></svg>
<div id="root"></div>
<script src="c-core.js"></script>
<script src="c-kit.js"></script>
<script>
const counters3 = `<div style="margin-top:2px;display:grid;grid-template-columns:115px 116px 115px;gap:2px">${[['59', '대회'], ['71', '트레이너'], ['3', '시즌']].map(([n, l]) => `<div class="pn" style="height:84px;padding:12px;display:flex;flex-direction:column;justify-content:space-between"><span class="t12 dim">${l}</span>${seg(n, 40, 2)}</div>`).join('')}</div>`;
const who = `<div class="t12 dim">현 챔피언</div><div class="t20" style="margin-top:8px">김현민</div><div class="t12 dim reg" style="margin-top:4px">6대, YPL 시즌 2 우승</div>`;
const more = `<span class="t12" style="display:flex;align-items:center;gap:4px">파티 보기 ${ic('arrow', 16, 1.5)}</span>`;

/* the champion block, four ways. All 350 x 216. */
const champ = {
  float: `<div style="display:grid;grid-template-columns:132px 216px;gap:2px"><div class="pn" style="height:216px;padding:12px;display:flex;flex-direction:column;justify-content:space-between"><div>${who}</div>${more}</div><div style="height:216px;position:relative"><img class="sprite" src="${S('garchomp')}" style="inset:20px;width:176px;height:176px"></div></div>`,
  /* one plane: the text and the Pokémon share a panel; the feet stand on a floor band of the next tone */
  floor: `<div class="pn stand" style="height:216px"><div class="floor" style="height:52px"></div>
    <div class="abs" style="left:12px;top:12px">${who}</div><div class="abs" style="left:12px;bottom:18px">${more}</div>
    <img class="sprite" src="${S('garchomp')}" style="left:auto;right:12px;transform:none;bottom:20px;width:184px;height:184px"></div>`,
  /* the board shows the generation; the champion stands in front of the number */
  number: `<div class="pn stand" style="height:216px">
    <div class="abs" style="right:52px;top:20px;--off:.05">${seg('6', 176, 1).replace('<g class="on">', '<g class="on" style="opacity:.22">')}</div>
    <div class="abs" style="left:12px;top:12px">${who}</div><div class="abs" style="left:12px;bottom:12px">${more}</div>
    <img class="sprite" src="${S('garchomp')}" style="left:auto;right:12px;transform:none;bottom:0;width:196px;height:196px"></div>`,
  /* number and floor together */
  both: `<div class="pn stand" style="height:216px"><div class="floor" style="height:32px"></div>
    <div class="abs" style="right:52px;top:12px;--off:.05">${seg('6', 160, 1).replace('<g class="on">', '<g class="on" style="opacity:.22">')}</div>
    <div class="abs" style="left:12px;top:12px">${who}</div><div class="abs t12" style="left:12px;bottom:8px;display:flex;align-items:center;gap:4px">파티 보기 ${ic('arrow', 16, 1.5)}</div>
    <img class="sprite" src="${S('garchomp')}" style="left:auto;right:12px;transform:none;bottom:16px;width:184px;height:184px"></div>`,
};
const home = (block, light = false) => `<div class="ph ${light ? 'light' : ''}">${bar(light)}<div class="ct">
  <div class="abs t12 dim" style="left:20px;right:20px;top:88px;display:flex;justify-content:space-between;align-items:center"><span style="display:flex;align-items:center;gap:8px"><span class="lamp"></span>다음 대회까지</span><span class="num">11.07 토</span></div>
  <div class="abs" style="left:20px;top:116px;height:120px;display:flex;align-items:flex-end;gap:12px">${seg('05', 120, 2)}<span class="t20" style="line-height:20px">일</span></div>
  <div class="abs t20" style="left:20px;top:256px">37회 파이컵 마스터 리그<br>NPC 배틀 7</div>
  <a class="btn abs" style="left:20px;right:20px;top:332px">이번 대회 신청 ${ic('arrow', 20, 2)}</a>
  <div class="abs" style="left:20px;top:436px;width:350px">${block}${counters3}</div></div>${tabs('home')}</div>`;

/* the hall rail below: each champion is one panel, the number behind, the feet on the name band */
const rail = list => `<div style="display:flex;gap:2px;margin:12px 0 0 20px">${list.map(([n, g, s, l]) => `<div class="pn stand" style="flex:none;width:132px;height:204px">
  <span class="abs" style="left:12px;top:10px"><span class="num t20">${g}</span><span class="t12 dim" style="margin-left:2px">대</span></span>
  <img class="sprite" src="${S(s)}" style="bottom:64px;width:104px;height:104px">
  <div class="floor" style="height:64px;padding:12px"><div class="t15" style="font-weight:700">${n}</div><div class="t12 dim reg" style="margin-top:4px">${l}</div></div></div>`).join('')}</div>`;
const homeLow = `<div class="ph">${bar()}<div class="ct">
  <div class="sh" style="margin-top:32px"><span class="t20">역대 챔피언</span><span class="link">명예의 전당</span></div>
  ${rail([['정두호', '5', 'lickilicky', 'YPL 시즌 1'], ['이제빈', '4', 'abomasnow-mega', '클래식 시즌 4'], ['허진욱', '3', 'kingambit', '클래식 시즌 3']])}
  <div class="sh" style="margin-top:52px"><span class="t20">팀 빌더</span><span class="link">새 팀</span></div>
  <div class="t12 dim" style="margin:12px 20px 0">고른 포켓몬은 패널의 바닥에 섭니다</div>
  <div class="fl" style="margin-top:8px;display:grid;grid-template-columns:56px 57px 57px 56px 57px 57px;gap:2px">${['garchomp', 'dragonite-mega', 'hydreigon'].map(s => `<span class="pn stand" style="height:64px"><span class="floor" style="height:12px"></span><img class="sprite" src="${S(s)}" style="bottom:6px;width:48px;height:48px"></span>`).join('')}${[1, 2, 3].map(() => `<span class="pn" style="height:64px;display:grid;place-items:center;color:var(--mute)">${ic('plus', 18)}</span>`).join('')}</div></div>${tabs('home')}</div>`;


/* no event ahead: the real state on 2026-11-02. The display stays switched off, the title says where the date will appear */
const champReal = champ.floor.replace("김현민", "정두호").replace("6대, YPL 시즌 2 우승", "5대, YPL 시즌 1 우승").replace('garchomp.webp', 'lickilicky.webp');
const counterReal = `<div style="margin-top:2px;display:grid;grid-template-columns:115px 116px 115px;gap:2px">${[['60', '대회'], ['55', '트레이너'], ['3', '시즌']].map(([n, l]) => `<div class="pn" style="height:84px;padding:12px;display:flex;flex-direction:column;justify-content:space-between"><span class="t12 dim">${l}</span>${seg(n, 40, 2)}</div>`).join('')}</div>`;
const homeNone = light => `<div class="ph ${light ? 'light' : ''}">${bar(light)}<div class="ct">
  <div class="abs t12 dim" style="left:20px;right:20px;top:88px;display:flex;align-items:center;gap:8px"><span class="lamp" style="background:var(--panel-2)"></span>다음 대회</div>
  <div class="abs" style="left:20px;top:116px;height:120px;display:flex;align-items:flex-end;gap:12px">${seg('  ', 120, 2)}<span class="t20 dim" style="line-height:20px">일</span></div>
  <div class="abs t20" style="left:20px;right:20px;top:256px">다음 대회 일정은<br>공지에 올라옵니다.</div>
  <a class="btn abs" style="left:20px;right:20px;top:332px">공지 보기 ${ic('arrow', 20, 2)}</a>
  <div class="abs" style="left:20px;top:436px;width:350px">${champReal.replace('<div class="pn"', '<div class="pn" ')}${counterReal}</div></div>${tabs('home')}</div>`;
const boardHTML = (title, lede, items) => `<section class="board"><h1>${title}</h1><p class="lede">${lede}</p><div class="row">${items.map(([cap, html]) => `<div>${html}<div class="cap">${cap}</div></div>`).join('')}</div></section>`;
const k = new URLSearchParams(location.search).get('b') || '21';
const R = document.getElementById('root');
if (k === '21') R.innerHTML = boardHTML('C21. 포켓몬이 서는 자리', '바탕만 걷어 내면 포켓몬이 아무것도 딛지 않아 떠 보입니다. 별도의 그림 상자는 두지 않고, 이름과 같은 패널 안에서 발을 땅에 붙입니다. 땅은 한 단계 밝은 바닥 띠입니다. 세대 번호를 뒤에 켜 보았지만(나, 다) 포켓몬에 가려 숫자로 읽히지 않고 화면만 복잡해져, 바닥 띠 하나를 추천합니다.', [['지금: 떠 있음', home(champ.float)], ['가. 바닥 띠 (추천)', home(champ.floor)], ['나. 세대 번호', home(champ.number)], ['다. 번호와 바닥', home(champ.both)]]);
if (k === '23') R.innerHTML = boardHTML('C23. 다음 대회가 없을 때', '지금 실제 데이터의 상태입니다. 카운트다운 판은 꺼진 채 자리를 지키고, 램프도 꺼집니다. 제목 자리에는 일정이 올라올 곳을 말하고, 주 행동은 공지 보기입니다. 챔피언과 대회, 트레이너 수는 2026-11-02의 실제 값이며, 시즌 수는 데이터에서 셉니다.', [['다음 대회 없음', homeNone(false)], ['밝은 모드', homeNone(true)]]);
if (k === '22') R.innerHTML = boardHTML('C22. 같은 규칙을 모든 포켓몬에', '포켓몬은 언제나 패널 안, 바닥에 발을 붙이고 섭니다. 역대 챔피언 카드는 이름 띠가 곧 바닥이고 세대는 왼쪽 위 글자로 둡니다. 팀 슬롯도 얇은 바닥을 가집니다. 밝은 모드에서도 같은 구조입니다.', [['홈, 역대 챔피언과 팀 슬롯', homeLow], ['홈, 밝은 모드', home(champ.floor, true)]]);
</script>
</body></html>
