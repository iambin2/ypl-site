<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 탭 아이콘: Wing Y를 칸에 크게 앉혔고, 어두운 탭에서는 SVG가 뒤집힌다. 브라우저가 아이콘을 오래 캐시하므로 그림을 바꾸면 파일 이름도 바꾼다. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon-ypl-2026-11-02.svg" />
    <!-- 홈 화면 앱: iOS는 여기서 연 앱에서만 공지 알림을 받을 수 있다 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 주소창은 상단 바와 이어지고, 상단 바는 두 테마 모두 네이비다 -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#081c3d" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#081c3d" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="포켓몬 센터 연세점에서 열리는 배틀 리그 YPL의 대진표와 기록." />
    <meta property="og:title" content="YPL | Yonsei Pokémon League" />
    <meta property="og:description" content="포켓몬 센터 연세점에서 열리는 배틀 리그 YPL의 대진표와 기록." />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="YPL" />
    <meta property="og:url" content="https://iambin2.github.io/ypl-site/" />
    <!-- 링크 미리보기 썸네일: 네이비 바탕에 흰 마크와 그린 워드마크, 1200x630.
         메신저가 캐시하므로 그림을 바꾸면 파일 이름도 바꾼다(원본 HTML은 docs/brand/og-ypl.html). -->
    <meta property="og:image" content="https://iambin2.github.io/ypl-site/og-ypl-2026-11-02.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="네이비 바탕 위 흰 Wing Y 로고와 YPL 워드마크" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- 서체: 한글은 Freesentation, 라틴과 숫자는 Albert Sans. 첫 화면의 글자가 바로 바뀌도록 본문과 제목의 첫 조각, 라틴 파일을 미리 받는다(scripts/build-font-slices.py). -->
    <link rel="preload" href="/fonts/albert-sans-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <!-- font-preloads:start -->
    <link rel="preload" href="/fonts/freesentation/slices/400-core.9bf18306.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/freesentation/slices/600-core.d9b517d9.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/freesentation/slices/700-core.4b540ac2.woff2" as="font" type="font/woff2" crossorigin />
    <!-- font-preloads:end -->
    <!-- 첫 그림부터 고른 테마로: 번들이 도는 뒤에 바꾸면 다크를 고른 사람에게 흰 화면이 잠깐 보인다 -->
    <script>var t;try{t=localStorage.getItem("ypl-theme-2")}catch(e){}if(t!=="dark"){document.documentElement.dataset.theme="light";document.documentElement.style.colorScheme="light"}</script>
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <title>YPL | Yonsei Pokémon League</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
