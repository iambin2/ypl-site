<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- 탭 아이콘: Wing Y를 칸에 크게 앉혔고, 어두운 탭에서는 SVG가 뒤집힌다. 브라우저가 아이콘을 오래 캐시하므로 그림을 바꾸면 파일 이름도 바꾼다. -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <!-- 검색 결과의 아이콘: Google은 48의 배수 크기를 찾고 원으로 자르므로 마크를 원 안에 크게 세웠다(docs/brand/search-icon.html) -->
    <link rel="icon" type="image/png" sizes="192x192" href="/search-icon-192.png" />
    <link rel="icon" type="image/svg+xml" href="/favicon-wing-2026-11-02.svg" />
    <!-- 홈 화면 앱: iOS는 여기서 연 앱에서만 공지 알림을 받을 수 있다 -->
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- 주소창은 상단 바와 이어지고, 상단 바는 두 테마 모두 네이비다 -->
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#081c3d" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#081c3d" />
    <meta name="color-scheme" content="light dark" />
    <!-- Search Console 소유권 인증: 지우면 인증이 풀린다 -->
    <meta name="google-site-verification" content="tlLuIjLPySYysyw6-PQBduAT_UdUacMrTIZpcYX48XI" />
    <meta name="google-site-verification" content="PtIcYR3QMpJUDvg78_GOMnCpEHtBegBKk0N40dYvhXU" />
    <!-- 검색용 대표 주소: App.jsx가 화면마다 바꾼다 -->
    <link rel="canonical" href="https://league.pokeyonsei.com/" />
    <!-- 검색 결과의 설명은 이름 한 줄뿐: 긴 글을 두면 메신저 미리보기에도 그 글이 길게 붙는다 -->
    <meta name="description" content="Yonsei Pokémon League" />
    <meta property="og:title" content="Yonsei Pokémon League" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="YPL" />
    <meta property="og:url" content="https://league.pokeyonsei.com/" />
    <!-- 링크 미리보기 썸네일: 네이비 바탕 한가운데 흰 마크와 그린 워드마크 하나뿐, 1200x630.
         메신저가 캐시하므로 그림을 바꾸면 파일 이름도 바꾼다(원본 HTML은 docs/brand/og-ypl.html). -->
    <meta property="og:image" content="https://league.pokeyonsei.com/og-ypl-2026-11-03b-logo.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="네이비 판 한가운데의 YPL 로고" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- 검색 결과 맨 위의 사이트 이름과 로고: 없으면 Google이 옛 주소의 "GitHub Pages documentation"을 붙인다 -->
    <script type="application/ld+json">{"@context":"https://schema.org","@graph":[{"@type":"WebSite","name":"YPL","alternateName":["Yonsei Pokémon League","연세 포켓몬 리그"],"url":"https://league.pokeyonsei.com/"},{"@type":"SportsOrganization","name":"Yonsei Pokémon League","alternateName":"YPL","url":"https://league.pokeyonsei.com/","logo":"https://league.pokeyonsei.com/icon-512.png"}]}</script>
    <!-- 서체: 한글은 Freesentation, 라틴과 숫자는 Albert Sans. 첫 화면의 글자가 바로 바뀌도록 본문과 제목의 첫 조각, 라틴 파일을 미리 받는다(scripts/build-font-slices.py). -->
    <link rel="preload" href="/fonts/albert-sans-latin-wght.woff2" as="font" type="font/woff2" crossorigin />
    <!-- font-preloads:start -->
    <link rel="preload" href="/fonts/freesentation/slices/400-core.9bf18306.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/freesentation/slices/600-core.d9b517d9.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/freesentation/slices/700-core.4b540ac2.woff2" as="font" type="font/woff2" crossorigin />
    <!-- font-preloads:end -->
    <!-- 첫 그림부터 네이비: CSS가 오기 전의 빈 화면이 흰색이면 네이비 첫 화면으로 넘어갈 때 번쩍인다 -->
    <style>html{background:#081c3d}</style>
    <!-- 첫 그림부터 고른 테마로: 번들이 도는 뒤에 바꾸면 다크를 고른 사람에게 흰 화면이 잠깐 보인다 -->
    <script>var t;try{t=localStorage.getItem("ypl-theme");if(t==="system")t=matchMedia("(prefers-color-scheme: light)").matches?"light":"dark"}catch(e){}if(t==="light"){document.documentElement.dataset.theme="light";document.documentElement.style.colorScheme="light";document.documentElement.style.background="#fff"}</script>
    <link rel="preconnect" href="%VITE_SUPABASE_URL%" crossorigin />
    <title>Yonsei Pokémon League</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
